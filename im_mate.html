<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iM Mate 플랫폼 데모</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            color: #1e293b; 
            overflow-x: hidden; 
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .transition-layout { transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 채팅방 스크롤 스타일 최적화 */
        #chat-messages::-webkit-scrollbar { width: 4px; }
        #chat-messages::-webkit-scrollbar-thumb { background-color: #e2e8f0; border-radius: 4px; }
        
        /* 구글 맵 이프레임 반응형 프레임 */
        .map-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            border-radius: 1.5rem;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-6 md:p-8">

        // 가변형 레이아웃 엔진 스위처 (채팅 강조 vs 대시보드 강조)
        function toggleChatWidth(forceState) {
            const chatScreen = document.getElementById('chat-screen');
            const rightPanel = document.getElementById('right-panel');
            const toggleText = document.getElementById('toggle-chat-width-text');
            const inputArea = document.getElementById('input-area');

            isChatExpanded = (forceState !== undefined) ? forceState : !isChatExpanded;

            if (isChatExpanded) {
                // [채팅 집중 모드] - 모바일에서는 채팅만 가득 채우고, 데스크톱에선 5:5 비율 분할
                chatScreen.className = "w-full md:w-[50%] h-full flex flex-col relative z-10 bg-white transition-layout border-r border-gray-200 animate-fade-in";
                rightPanel.className = "hidden md:flex md:w-[50%] h-full bg-gray-50 relative z-0 transition-layout";
                if(toggleText) toggleText.innerText = "분석 복귀";
                inputArea.classList.remove('hidden');
            } else {
                // [대시보드 집중 모드] - 모바일에서는 대시보드만 가득 채우고, 데스크톱에선 미니멀 사이드바(30%) 배치
                chatScreen.className = "hidden md:flex md:w-[32%] h-full flex-col relative z-10 bg-white transition-layout border-r border-gray-200";
                rightPanel.className = "w-full md:w-[68%] h-full bg-gray-50 relative z-0 transition-layout";
                if(toggleText) toggleText.innerText = "채팅 확장";
                inputArea.classList.add('hidden');
            }
            
            // 레이아웃 변경 후 부드러운 스크롤 복원
            scrollToBottom();
        }

            currentBundle = [];

            const chatMessages = document.getElementById('chat-messages');
            const welcomeView = document.getElementById('welcome-view');

        function appendMessage(sender, text) {

        function sendReply() {
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value;
            if(!text.trim()) return;

            appendMessage('user', text);
            
            if (chatHistoryData.length > 0 && chatHistoryData[chatHistoryData.length - 1].role === 'user') {
                chatHistoryData[chatHistoryData.length - 1].parts[0].text += " | " + text;
            } else {
                chatHistoryData.push({ role: "user", parts: [{ text: text }] });
            }
            
            inputEl.value = '';
            
            const quickReplyContainer = document.getElementById('quick-replies');
            if(quickReplyContainer) {
                quickReplyContainer.classList.add('hidden');
                quickReplyContainer.innerHTML = '';
            }

            showTypingIndicator();
            chatStep++;

            extractDataFromContext();

            if (text.match(/(결제|진행|오케이|고고|완료|승인|구성|패키지)/)) {
                 setTimeout(() => { 
                    removeTypingIndicator();
                    appendMessage('ai', "초연결 통합 플랫폼 매칭 검증 완료! 분석된 이동 동선 및 공간 권한, 제품 주문 가계약을 정렬하여 하나의 포트폴리오로 오케스트레이션 합니다. 🚀");
                    setTimeout(() => { startLoadingEngines(); }, 1200); 
                }, 1000);
                 return;
            }

            callGeminiAPI();
        }

        function extractDataFromContext() {
            const allUserText = chatHistoryData.filter(msg => msg.role === 'user').map(msg => msg.parts[0].text).join(" ");
            
            if (allUserText.match(/오전|오후|[0-9]+시|[0-9]+분/)) {
                let matched = allUserText.match(/(오전|오후|아침|저녁)?\s?[0-9]+시(\s?[0-9]+분)?/);
                if(matched) userTime = matched[0];
            }
            
            if (allUserText.includes('쏘카') || allUserText.includes('카쉐어링') || allUserText.includes('렌트') || allUserText.includes('차량')) {
                userTransport = 'taxi'; 
            } else if (allUserText.includes('KTX') || allUserText.includes('기차') || allUserText.includes('열차') || allUserText.includes('철도')) {
                userTransport = 'public'; 
            } else if (allUserText.includes('지하철') || allUserText.includes('대중교통')) {
                userTransport = 'public';
            } else if (allUserText.includes('택시') || allUserText.includes('카카오')) {
                userTransport = 'taxi';
            }

            let foodMatch = allUserText.match(/(삼겹살|소고기|국밥|파스타|피자|초밥|스테이크|한정식|횟집|회|조개구이|인투|오스테리아밀즈|다이닝|맛집|루프탑|정원)/);
            if (foodMatch) {
                userMenu = foodMatch[1];
            }
            
            let skinMatch = allUserText.match(/(여드름|압출|트러블|피지|리프팅|슈링크|미백|필러|보톡스|스킨부스터|탄력|케어)/);
            if (skinMatch) {
                userSkinConcern = skinMatch[1];
            }

            if (allUserText.includes('호텔') || allUserText.includes('오션뷰')) userHotel = '호텔';
            else if (allUserText.includes('에어비앤비') || allUserText.includes('한옥') || allUserText.includes('독채')) userHotel = '에어비앤비';

            if (allUserText.includes('시카') || allUserText.includes('크림') || allUserText.includes('재생') || allUserText.includes('화장품') || allUserText.includes('배송')) {
                userPostCare = '재생크림';

            if (allUserText.includes('캐주얼') || allUserText.includes('남친룩') || allUserText.includes('니트')) {
                userOutfitStyle = 'men_casual';
            } else if (allUserText.includes('미니멀') || allUserText.includes('셋업') || allUserText.includes('수트')) {
                userOutfitStyle = 'men_minimal';
            }
        }

        async function callGeminiAPI() {
            if (!apiKey || apiKey.trim() === "") {
                console.log("No API Key, running localized mock agent.");
                fallbackDemoResponse();
                return;
            }

            const systemPrompt = `너는 DGB금융그룹의 초연결 맞춤 라이프케어 플랫폼인 'iM Mate'의 커스터마이징 AI 에이전트야. 사용자의 구두 의도를 완벽히 실시간 조율하여 '실시간 이동', '공간 제휴 예약', '당일 맞춤 주문 배송'을 하나로 오케스트레이션 해야 해.
            
[현재 선택 시나리오]
- ${currentScenario === 'dongseongro' ? '대구 동성로 소개팅 (남성 필승 전용 아웃핏 스타일 제안 + 파스타 다이닝 2선 매칭 + 교통 수단 통합 배정)' : (currentScenario === 'haeundae' ? '부산 1박 2일 여행 (KTX 왕복 탑승권 or 쏘카 카셰어링 24시간 선택 + 숙소 2선 선택 매칭 + 대표 로컬 맛집 연계)' : '대구 메디컬 안심 뷰티 (여드름 집중/슈링크 리프팅 전문 병의원 선택 + 안심 수송 차량 호출 + 약국 수딩 제품 직배송)')}

[절대 규칙]
1. 어려운 영문 용어는 원천 차단하고 '실시간 이동', '제휴 공간 예약', '당일 맞춤 주문 배송' 등의 일상 언어만 쓴다.
2. 친근하며 전담 비서 톤앤매너로 답변한다.
3. 조율이 최종 합의되면 문장 마지막에 "[엔진가동]" 토큰을 붙여 즉시 영수증을 렌더링한다.`;

            const payload = {
                contents: chatHistoryData,
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { temperature: 0.7, maxOutputTokens: 600 }
            };

            try {
                const response = await fetch(`${GEMINI_API_URL}?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('API Session Broken');
                
                const data = await response.json();
                let aiText = "가장 완벽한 인프라 결합 노선을 정밀하게 대조하는 중입니다."; 
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    aiText = data.candidates[0].content.parts[0].text;
                }
                
                removeTypingIndicator();
                
                let triggerEngine = false;
                if (aiText.includes("[엔진가동]")) {
                    triggerEngine = true;
                    aiText = aiText.replace("[엔진가동]", "").trim();
                }

                appendMessage('ai', aiText);
                chatHistoryData.push({ role: "model", parts: [{ text: aiText }] });
                extractDataFromContext();

                if (triggerEngine) {
                    setTimeout(() => { startLoadingEngines(); }, 1500);
                }

            } catch (error) {
                console.error("Gemini Live Integration Error, deploying fallback:", error);
                fallbackDemoResponse(); 
            }
        }

                        <!-- 배차시간 및 이용요금 정보판 3컬럼 확장 -->
                        <div class="grid grid-cols-3 gap-2 mb-4 text-center">
                            <div class="bg-gray-50/50 p-2.5 rounded-2xl border border-gray-100">
                                <span class="block text-[9px] font-bold text-gray-400">예상 소요시간</span>
                                <span id="route-duration-text" class="text-sm md:text-base font-black text-[#1e293b]">${rData.duration}</span>
                            </div>
                            <div class="bg-gray-50/50 p-2.5 rounded-2xl border border-gray-100">
                                <span class="block text-[9px] font-bold text-gray-400">일반 이용 요금</span>
                                <span id="route-cost-text" class="text-xs md:text-sm font-black text-[#1e293b]">${rData.cost}</span>
                            </div>
                            <div class="bg-gray-50/50 p-2.5 rounded-2xl border border-gray-100">
                                <span class="block text-[9px] font-bold text-gray-400">배차/대기 간격</span>
                                <span id="route-interval-text" class="text-xs md:text-sm font-black text-[#1e293b]">${rData.interval || '즉시 예약'}</span>
                            </div>
                        </div>

                        <!-- 분석 가이드 요약 얼럿 -->
                        <div class="bg-emerald-50/50 border border-emerald-100 rounded-2xl p-3.5 mb-4 text-xs leading-relaxed text-emerald-800 font-semibold">
                            💡 <span id="route-recommend-alert">${rData.recommendation}</span>
                        </div>

                        <!-- 실시간 진행 타임라인 단계 구조 -->
                        <div class="space-y-3.5 border-t border-gray-100 pt-4" id="route-timeline">
                            <!-- 단계별 steps 동적 주입 -->
                        </div>
                    </div>

                    <!-- 결합 상품 목록 영역 -->
                    <div class="space-y-4 max-w-2xl mx-auto">
            `;

            currentBundle.forEach((item, index) => {
                const isCustomCard = item.img && item.img.includes('다운로드.png');
                html += `
                    <div onclick="cardClicked(event, ${index})" class="rounded-3xl p-5 border transition-all duration-300 cursor-pointer relative overflow-hidden ${item.checked ? 'bg-white border-gray-200/80 shadow-sm' : 'border-2 border-dashed border-gray-200 bg-gray-50/50 hover:bg-gray-50 hover:border-gray-300' }">
                        ${item.checked && item.color === 'purple' ? '<div class="absolute top-0 left-0 w-1.5 h-full bg-[#00D09B]"></div>' : ''}
                        ${item.checked && item.color === 'accent1' ? '<div class="absolute top-0 left-0 w-1.5 h-full bg-[#0B4A99]"></div>' : ''}
                        ${item.checked && item.color === 'accent2' ? '<div class="absolute top-0 left-0 w-1.5 h-full bg-[#00A87E]"></div>' : ''}
                        
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-bold tracking-wider ${item.checked ? (item.color === 'purple' ? 'text-[#00D09B]' : (item.color === 'accent1' ? 'text-[#0B4A99]' : 'text-[#00A87E]')) : 'text-gray-400'}">
                                <i class="fas ${item.icon} mr-1.5"></i> ${item.category}
                            </span>
                            <div class="flex items-center space-x-3" onclick="event.stopPropagation();">
                                <span class="${item.checked ? 'bg-gray-50 text-gray-400 border-gray-100' : 'bg-amber-50 text-amber-700 border-amber-100' } text-[10px] px-2 py-0.5 rounded border font-bold tracking-wide">
                                    ${item.checked ? item.badge : '+ 선택 추가 가능'}
                                </span>
                                <label class="relative inline-flex items-center cursor-pointer">
                                  <input type="checkbox" value="" class="sr-only peer" ${item.checked ? 'checked' : ''} onchange="toggleItem(${index})">
                                  <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-200 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#00D09B] shadow-inner"></div>
                                </label>
                            </div>
                        </div>
                        
                        <!-- 고화질 라이브 이미지 연계 파트 -->
                        <div class="flex items-center">
                            ${isCustomCard ? `
                                <div class="w-16 h-16 rounded-2xl bg-white border border-gray-200 flex items-center justify-center mr-4 flex-shrink-0 shadow-sm relative ${item.checked ? 'opacity-100' : 'opacity-70'} transition-opacity">
                                    <span class="text-[11px] font-black tracking-tighter text-center">
                                        <span class="text-[#00D09B]">iM</span><span class="text-slate-800">원패스</span>
                                    </span>
                                </div>
                            ` : `
                                <img src="${item.img || 'https://placehold.co/150x150/f1f5f9/00D09B?text=Asset'}" class="w-16 h-16 rounded-2xl object-cover mr-4 flex-shrink-0 transition-opacity ${item.checked ? 'opacity-100' : 'opacity-70'}" onerror="this.onerror=null; this.src='https://placehold.co/150x150/f1f5f9/00D09B?text=Asset';">
                            `}
                            <div class="flex-1 min-w-0">
                                <h3 class="font-extrabold ${item.checked ? 'text-[#1e293b]' : 'text-gray-400'} text-sm md:text-base truncate">${item.title}</h3>
                                <p class="text-xs ${item.checked ? 'text-gray-500' : 'text-gray-400'} mt-1 leading-relaxed truncate md:whitespace-normal">${item.desc}</p>
                            </div>
                            <div class="text-right ml-2 flex-shrink-0">
                                <div class="font-black ${item.checked ? 'text-[#1e293b]' : 'text-gray-400'} text-base md:text-lg">₩${item.price.toLocaleString()}</div>
                            </div>
                        </div>
                        
                        <!-- 다른 조건 변경 기능: 이벤트 버블링 방지 및 레이아웃 자동 열기 바인딩 -->
                        <div class="mt-4 pt-3 border-t border-gray-100/80 flex justify-end" onclick="event.stopPropagation();">
                            <button onclick="requestSwap(${index})" class="text-[11px] font-bold text-[#00A87E] hover:text-[#00b386] transition flex items-center bg-[#00D09B]/5 hover:bg-[#00D09B]/15 px-3 py-1.5 rounded-xl border border-[#00D09B]/20 shadow-sm">
                                <i class="fas fa-sync-alt mr-1.5"></i> 이 조건 다른것으로 변경 (AI 피드백)
                            </button>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
                
                <!-- 결제 인터랙션 제어부 -->
                <div class="absolute bottom-0 right-0 w-full bg-white/95 backdrop-blur border-t border-gray-100 px-6 py-6 flex justify-between items-center z-10">
                    <div class="ml-2">
                        <div class="text-xs font-semibold text-gray-400 mb-0.5">통합 제휴 일괄 결제액</div>
                        <div class="text-3xl font-black text-[#1e293b] tracking-tighter">₩${totalAmount.toLocaleString()}</div>
                    </div>
                    <button onclick="triggerPayment()" class="mr-2 bg-gradient-to-r from-[#00D09B] to-[#00A87E] hover:opacity-90 text-white font-black py-4 px-8 rounded-2xl shadow-lg shadow-[#00D09B]/20 transform transition active:scale-95 flex items-center text-base">
                        <i class="fas fa-fingerprint text-xl mr-2"></i> 일괄 결제 승인
                    </button>
                </div>
            `;
            container.innerHTML = html;
            
            toggleRouteType(defaultType);
        }

        window.cardClicked = function(event, index) {
            currentBundle[index].checked = !currentBundle[index].checked;
            renderResultScreen(currentTitle);
        }

        window.toggleItem = function(index) {
            currentBundle[index].checked = !currentBundle[index].checked;
            renderResultScreen(currentTitle);
        }

        // [이 조건 다른 것으로 변경] 작동 엔진 고도화
        window.requestSwap = function(index) {
            const item = currentBundle[index];
            const chatInput = document.getElementById('chat-input');
            const inputArea = document.getElementById('input-area');
            
            // 1. 강제 채팅 화면 집중 확장 (모바일 완전 노출, 데스크톱 5:5 노출 보장)
            toggleChatWidth(true);
            
            // 2. 입력란 가시화 활성
            inputArea.classList.remove('hidden');
            
            // 3. AI 에이전트 구동 질문 빌딩 및 실시간 발송 유도
            chatInput.value = `${item.title} 말고 다른 스페셜 대안을 비교 추천해줘.`;
            sendReply();
            
            // 4. 기존 항목 체크를 잠시 해제하여 교체 상태임을 부드럽게 고지
            currentBundle[index].checked = false;
            renderResultScreen(currentTitle);
        }

        function triggerPayment() {
            let totalAmount = currentBundle.filter(i => i.checked).reduce((sum, item) => sum + item.price, 0);

            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-gray-900/40 backdrop-blur-md flex justify-center items-center z-50 animate-fade-in p-4';
            modal.innerHTML = `
                <div class="bg-white rounded-[2.5rem] p-8 max-w-sm w-full border border-gray-100 shadow-2xl text-center transform transition-all">
                    <div class="w-20 h-20 bg-gray-50 rounded-full flex justify-center items-center mx-auto mb-6 border border-gray-100">
                        <i class="fas fa-fingerprint text-4xl text-[#00D09B] animate-pulse"></i>
                    </div>
                    <h3 class="text-xl font-black text-[#1e293b] mb-1">iM Mate 생체 서명</h3>
                    <p class="text-gray-400 mb-6 text-xs">보안 토큰을 활용한 원스톱 통합 승인</p>
                    <div class="text-3xl font-black text-[#1e293b] mb-8 tracking-tighter">₩${totalAmount.toLocaleString()}</div>
                    
                    <div class="relative w-full h-1 bg-gray-100 rounded-full overflow-hidden mb-3">
                        <div class="absolute top-0 left-0 h-full bg-[#00D09B] rounded-full" style="width: 0%; transition: width 1.4s ease-in-out;" id="progress-bar"></div>
                    </div>
                    <div class="text-xs font-semibold text-gray-400" id="payment-status">보안 모듈 통신 승인 중...</div>
                </div>
            `;
            document.body.appendChild(modal);

            setTimeout(() => { document.getElementById('progress-bar').style.width = '100%'; }, 100);
            
            setTimeout(() => {
                document.getElementById('payment-status').innerText = '생체 서명 승인 및 일관 예약 완료';
                document.getElementById('payment-status').classList.remove('text-gray-400');
                document.getElementById('payment-status').classList.add('text-[#00D09B]');
                document.querySelector('.fa-fingerprint').className = 'fas fa-check text-4xl text-[#00D09B]';
                
                setTimeout(() => {
                    modal.remove();
                    renderReceiptScreen();
                }, 1200);
            }, 1500);
        }

        function renderReceiptScreen() {
            const container = document.getElementById('result-content');
            let totalAmount = currentBundle.filter(i => i.checked).reduce((sum, item) => sum + item.price, 0);
            const date = new Date().toLocaleString('ko-KR');

            document.getElementById('chat-screen').classList.remove('md:flex', 'flex');
            document.getElementById('chat-screen').classList.add('hidden');
            
            const rightPanel = document.getElementById('right-panel');
            rightPanel.className = "w-full h-full bg-white transition-layout";

            let html = `
                <div class="animate-fade-in pb-12 min-h-full flex flex-col justify-center items-center p-2">
                    <div class="bg-white rounded-[2.5rem] p-6 md:p-10 border border-gray-100 shadow-xl w-full max-w-lg relative mt-10">
                        <div class="absolute -top-10 left-1/2 transform -translate-x-1/2">
                            <div class="w-20 h-20 bg-gradient-to-tr from-[#00D09B] to-[#00A87E] rounded-full flex justify-center items-center shadow-lg shadow-[#00D09B]/20 border-4 border-white">
                                <i class="fas fa-check text-3xl text-white"></i>
                            </div>
                        </div>
                        
                        <div class="text-center mt-10 mb-8">
                            <h2 class="text-2xl font-black text-[#1e293b] mb-1.5">통합 거래 및 승인이 완료되었습니다</h2>
                            <p class="text-gray-400 text-xs">${date}</p>
                        </div>
                        
                        <div class="border-t border-dashed border-gray-200 py-6 space-y-4">
            `;

            currentBundle.filter(i => i.checked).forEach(item => {
                html += `
                    <div class="flex justify-between items-center text-sm">
                        <div class="flex items-center text-gray-500 font-semibold truncate mr-2">
                            <div class="w-7 h-7 rounded-full bg-gray-50 flex items-center justify-center mr-3 border border-gray-100 flex-shrink-0">
                                <i class="fas ${item.icon} text-[#00D09B] text-[10px]"></i>
                            </div>
                            <span class="truncate">${item.title}</span>
                        </div>
                        <div class="font-extrabold text-[#1e293b] flex-shrink-0">₩${item.price.toLocaleString()}</div>
                    </div>
                `;
            });

            html += `
                        </div>
                        
                        <div class="border-t border-gray-100 pt-5 mt-2 flex justify-between items-center">
                            <span class="text-base font-bold text-gray-400">최종 청구 총액</span>
                            <span class="text-3xl font-black text-[#00D09B]">₩${totalAmount.toLocaleString()}</span>
                        </div>
                        
                        <!-- 사후 상담 복귀 버튼이 추가된 결제 하단 영역 -->
                        <div class="mt-8 flex flex-col gap-3">
                            <div class="flex flex-col sm:flex-row gap-3">
                                <button onclick="resetToHome()" class="w-full sm:w-1/2 bg-gray-50 hover:bg-gray-100 text-gray-500 font-bold py-4 px-4 rounded-2xl transition border border-gray-100 text-sm">
                                    <i class="fas fa-home mr-1.5"></i> 처음 홈으로 복귀
                                </button>
                                <button onclick="showReservationTicket()" class="w-full sm:w-1/2 bg-[#00D09B] hover:bg-[#00b386] text-white font-bold py-4 px-4 rounded-2xl shadow-md shadow-[#00D09B]/20 transition text-sm">
                                    <i class="fas fa-ticket-alt mr-1.5"></i> 통합 모바일 패스 발급
                                </button>
                            </div>
                            <!-- 결제 종료 후에도 AI 비서와 소통하도록 유도하는 리액션 제공 -->
                            <button onclick="returnToChatFromReceipt()" class="w-full bg-[#00D09B]/10 hover:bg-[#00D09B]/20 text-[#00A87E] font-bold py-4 px-4 rounded-2xl transition text-sm flex items-center justify-center gap-2">
                                <i class="fas fa-comments"></i> AI 비서와 대화 계속하기
                            </button>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        // 영수증에서 대화 계속하기를 원할 때 채팅을 가시화하는 유틸 함수
        window.returnToChatFromReceipt = function() {
            const chatScreen = document.getElementById('chat-screen');
            chatScreen.classList.remove('hidden');
            
            // 입력창 가시화 확보
            document.getElementById('input-area').classList.remove('hidden');
            
            toggleChatWidth(true); // 강제 화면 분할/확장 적용
            
            // 안심 및 친근한 가이드 전구
            appendMessage('ai', "결제 내역을 소지한 상태로 초연결 플랫폼 상담을 이어나갑니다. 추가로 조율하고 싶으신 동선이나 세부 혜택이 있으신가요? 제게 편하게 말씀해 주세요. 😊");
        }

        function showReservationTicket() {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-gray-900/40 backdrop-blur-md flex justify-center items-center z-[70] animate-fade-in p-4';
            modal.innerHTML = `
                <div class="bg-white rounded-[2.5rem] p-7 max-w-sm w-full border border-gray-100 shadow-2xl text-center relative">
                    <button onclick="this.parentElement.parentElement.remove()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center bg-gray-50 hover:bg-gray-100 rounded-full text-gray-400 transition">
                        <i class="fas fa-times"></i>
                    </button>
                    <div class="w-14 h-14 bg-[#00D09B]/10 rounded-2xl flex justify-center items-center mx-auto mb-4 border border-[#00D09B]/20">
                        <i class="fas fa-qrcode text-2xl text-[#00D09B]"></i>
                    </div>
                    <h3 class="text-lg font-black text-[#1e293b] mb-1">iM Mate 통합 모바일 인증 패스</h3>
                    <p class="text-gray-400 mb-6 text-xs">iM 안심택시 태블릿 단말기, 제휴 숙소 및 매장 기기 센서에<br>아래 QR코드를 인증해 주세요.</p>
                    
                    <div class="bg-white p-4 rounded-2xl border border-gray-100 mb-6 flex justify-center items-center shadow-inner">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=iMMateIntegratedReservation_Done&color=1e293b" alt="QR Code" class="w-32 h-32 rounded-lg">
                    </div>
                    
                    <button onclick="this.parentElement.parentElement.remove()" class="w-full bg-gray-100 hover:bg-gray-200 text-[#1e293b] font-bold py-3.5 px-4 rounded-xl transition text-sm">
                        인증 완료
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        }
    </script>
</body>
</html>
