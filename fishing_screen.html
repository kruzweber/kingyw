        : phase === "reeling" ? "누르고 있으면 감고, 놓으면 텐션을 낮춘다." : "버튼 하나로 던지기, 챔질, 힘겨루기를 진행한다.";
    }

    function hideResultPopup() {
      resultPopup.hidden = true;
    }

    function queuePendingEvent(eventId) {
      if (!eventId) return;
      if (!state.pendingEvents.includes(eventId) && !state.seenEvents.includes(eventId)) {
        state.pendingEvents.push(eventId);
      }
      state = window.GameState.save(state);
    }

    function showJaemoFlipperFieldEvent() {
      const event = window.GameState.eventDefinitions.jaemo_flipper_found;
      if (!event) return;
      if (!state.seenEvents.includes("jaemo_flipper_found")) state.seenEvents.push("jaemo_flipper_found");
      state = window.GameState.save(state);
      lastPortraitEmotion = "happy";
      setPhase("blocked");
      showEventDialogueStep({
        eventId: "jaemo_flipper_found",
        speaker: event.speaker || "재모",
        portrait: "jaemo",
        lines: [
          `[${event.cutin || "오리발!"}] ${event.lines?.[0] || "내 오리발을 찾아줬구나!"}`,
          `[재모] ${event.lines?.[1] || "고맙다. 보트는 있는데 오리발이 없으면 마음이 허전하거든."}`,
          "[보상] 재모의 민물보트를 획득했다.",
          "[안내] 이제 민물 보트 필드로 나갈 수 있다."
        ]
      });
    }

    function confirmResultPopup() {
      hideResultPopup();
      if (pendingResultEvent) {
        const eventId = pendingResultEvent;
        pendingResultEvent = null;
        if (eventId === "jaemo_flipper_found") {
          showJaemoFlipperFieldEvent();
          return;
        }
        if (eventId === "g70_key_found") {
          const keyResult = {
            kind: "event",
            name: "준우가 훔친 G70 열쇠",
            rewardLabel: "G70",
            desc: "백상아리 배 속에서 찾았다."
          };
          pendingResultEvent = "g70_key_found_after";
          lastPortraitEmotion = "surprised";
          setLogs(["[영우] 백상아리 뱃속에 뭔가 있다...", "[확인] 조심해서 꺼내보자.", "", ""]);
          showResultPopup(keyResult);
          return;
        }
        if (eventId === "g70_key_found_after") {
          lastPortraitEmotion = "revenge";
          setPhase("ready");
          setLogs(["[보조키!] 백상아리 배 속에서 G70 차키를 찾았다.", "[영우] G70 키를 찾았다.", "[영우] 복수의 불길이 다시 살아났다.", "[보상] G70이 창고로 돌아왔다."]);
          return;
        }
        queuePendingEvent(eventId);
        location.href = "game_home.html";
      }
    }

    function resultImageSrc(result) {
      if (result.kind === "fish") return window.FishSprites?.src(result.name, false) || "";
      if (result.kind === "junk" || result.kind === "event") return window.JunkSprites?.src(result.name, false) || "";
      return "";
    }

    function rewardTextForResult(result, emptyText = "보상 없음") {
      if (result.rewardLabel) return result.rewardLabel;
      if (result.kind === "event" || result.kind === "junk") {
        const junkEntry = window.GameState.junkData?.find((item) => item.name === result.name);
        if (junkEntry?.rewardLabel) return junkEntry.rewardLabel;
        const permanentEntry = junkEntry?.permanentLabel || junkEntry?.permanentEffect || junkEntry?.statBonusLabel || junkEntry?.abilityLabel;
        if (permanentEntry) return `보유 효과(${permanentEntry})`;
        if (junkEntry) {
          const parts = [];
          if (junkEntry.gold) parts.push(`${Number(junkEntry.gold).toLocaleString()}G`);
          if (junkEntry.fame) parts.push(`명성 ${Number(junkEntry.fame).toLocaleString()}`);
          if (parts.length) return parts.join(" / ");
        }
      }
      const rewardParts = [];
      if (result.gold > 0) rewardParts.push(`${Number(result.gold).toLocaleString()}G`);
      if (result.fame > 0) rewardParts.push(`명성 ${Number(result.fame).toLocaleString()}`);
      const permanent = result.permanentLabel || result.permanentEffect || result.statBonusLabel || result.abilityLabel;
      if (permanent) rewardParts.push(`보유 효과(${permanent})`);
      return rewardParts.join(" / ") || emptyText;
    }

    function showResultPopup(result) {
      const primaryLabel = result.kind === "fish" ? "등급" : "분류";
      const hasOwnedEffect = Boolean(result.permanentLabel || result.permanentEffect || result.statBonusLabel || result.abilityLabel);
      const primaryValue = result.kind === "fish" ? `Lv.${result.level || "?"}` : result.kind === "event" ? "이벤트" : hasOwnedEffect ? "고급 유실물" : "유실물";
      const rewardValue = rewardTextForResult(result);
      resultName.textContent = result.name;
      resultImage.src = resultImageSrc(result);
      resultImage.alt = result.name;
      resultPrimaryLabel.textContent = primaryLabel;
      resultLevel.textContent = primaryValue;
      resultGold.textContent = rewardValue;
      resultDesc.textContent = result.desc || "영우가 약속으로 버텨냈다.";
      resultPopup.hidden = false;
    }

    function actionPress() {
      if (phase === "blocked") {
        return;
      }
      if (!hasActiveFishingGear()) {
        setPhase("blocked");
        setLogs([
          `[장비] ${gear().name}`,
          field.gearType === "sea" ? "[상점] 바다 장비를 먼저 준비해야 한다." : "[창고] 민물 장비를 먼저 장착해야 한다.",
          "[안내] 낚시를 진행할 수 없다.",
          "[영우] 맨손 낚시는 다큐에서나 하는 거다."
        ]);
        return;
      }
      if (phase === "ready" || phase === "caught" || phase === "missed") {
        hideResultPopup();
        heldResult = null;
        lastPortraitEmotion = "thinking";
        castGauge = 0.16;
        castDir = 1;
        setPhase("aimingDistance");
        resetBobber();
        setLogs(["[던지기 1단계] 가까움/멀리 거리 조절.", "[조작] 원하는 거리에서 버튼을 누르자.", "[감각] 초록 구간이면 찌가 안정적으로 날아간다.", "[영우] 이번엔 물이 아니라 물고기를 맞히자."]);
        return;
      }

      if (phase === "aimingDistance") {
        castDistance = castGauge;
        castGauge = 0.5;
        castDir = 1;
        setPhase("aimingSide");
        setLogs([`[확정] 거리 ${Math.round(castDistance * 100)}%.`, "[던지기 2단계] 좌우 방향 조절.", "[조작] 중앙에 가까울수록 목표 근처에 떨어진다.", "[영우] 손목아, 오늘만 배신하지 말자."]);
        return;
      }

      if (phase === "aimingSide") {
        castSide = castGauge;

        if ((field.id === "sea" || field.id === "ocean") && state.loadout.sea === "firstLeisure" && !state.flags.first_leisure_broken) {
          const event = window.GameState.triggerFirstLeisureBreak(state);
          state = event.state;
          firstLeisureBrokenThisTrip = Boolean(event.triggered);
          refreshState();
          lastPortraitEmotion = "panic";
          setPhase("blocked");
          showEventDialogueStep({
            speaker: "낚시왕 남영우",
            portrait: "youngwoo",
            lines: ["[파손] 장비가 첫 던지기에 버티지 못했다.", "[상황] 더는 낚시를 진행할 수 없다.", "[나가기] 지금은 나가기만 가능하다.", "[영우] 일단 돌아가서 상황을 정리하자."]
          });
          return;
        }

        const preview = castPreviewPoint(castDistance, castSide);
        const bounds = castBounds();
        bobber.targetX = clamp(preview.x + rand(-10, 10), bounds.minX, bounds.maxX);
        bobber.targetY = clamp(preview.y + rand(-8, 8), bounds.minY, bounds.maxY);
        target = null;
        biteState = null;
        bitePulse = 0;
        weakGearNoticeShown = false;
        swimmers.forEach((fish) => fish.hooked = false);
        hookTimer = 8.5 - castDistance * 2.4;
        hookProximity = 0;
        biteWait = rand(0.75, 1.65) + castDistance * 0.55;
        hookDisplayProximity = 0;
        const tip = rodTip();
        castFlight = {
          fromX: tip.x,
          fromY: tip.y,
          toX: bobber.targetX,
          toY: bobber.targetY,
          t: 0,
          duration: 0.82 + castDistance * 0.42,
          arc: 78 + castDistance * 92
        };
        castSplashPlayed = false;
        bobber.x = castFlight.fromX;
        bobber.y = castFlight.fromY;
        setPhase("casting");
        window.GameAudio?.playSfx("cast");
        window.GameAudio?.playVoice("cast");
        setLogs([`[던지기] 거리 ${Math.round(castDistance * 100)}%, 방향 ${Math.round(castSide * 100)}%.`, "[비행] 찌가 포물선을 그리며 날아간다.", "[대기] 착수 후 입질이 올 때까지 기다리자.", "[영우] 물살보다 심장이 더 출렁인다."]);
        return;
      }

      if (phase === "casting") {
        if (castFlight) {
          setLogs(["[비행] 찌가 아직 날아가는 중이다.", "[챔질] 수면에 닿고 목표가 붙을 때까지 기다리자.", "[주의] 너무 빨리 누르면 허공 챔질이다.", "[영우] 기다리는 것도 기술이라니, 억울하다."]);
          return;
        }
        if (biteWait > 0 || !target) {
          miss("[실패] 너무 빨리 챔질했다. 아직 입질이 오지 않았다.");
          return;
        }
        if (biteState && !biteState.committed) {
          miss("[실패] 아직 물고기가 건드리지 않았다. 찌가 툭 움직일 때까지 기다리자.");
          return;
        }
        if (hookProximity < requiredHookProximity()) {
          miss("[실패] 툭 건드린 순간이 아니었다. 성공률이 올라갈 때 눌러야 한다.");
          return;
        }
        setPhase("reeling");
        reelHeld = false;
        const level10Fight = target.item.kind === "fish" && Number(target.item.level || 0) >= 10;
        fightStartDistance = Math.max(level10Fight ? 76 : 70, Math.hypot(bobber.x - landingPoint().x, bobber.y - landingPoint().y));
        const startDifficulty = target.item.difficulty || 1;
        const startTensionMax = level10Fight ? 62 : 76;
        tension = clamp(30 + startDifficulty * (level10Fight ? 2.1 : 3.6) + rand(-4, 8), 24, startTensionMax);
        catchProgress = 0;
        fightElapsed = 0;
        const now = performance.now();
        nextFightSurgeAt = now + rand(650, 1500);
        fightSurgeUntil = 0;
        fightSurgeStrength = 0;
        biteFlashUntil = performance.now() + 620;
        fightMessage = "";
        fightMessageUntil = 0;
        const weakGearNotice = weakGearNoticeFor(target.item);
        weakGearNoticeShown = Boolean(weakGearNotice);
        setLogs([
          "[입질] 뭔가 걸렸다!",
          "[힘겨루기] 버튼을 누르면 감고, 놓으면 텐션을 낮춘다.",
          "[주의] 텐션이 너무 높거나 낮으면 놓친다.",
          weakGearNotice || "[영우] 손끝이 먼저 알고 허리가 나중에 후회한다."
        ]);
        return;
      }
    }

    function miss(reason) {
      reelHeld = false;
      swimmers.forEach((fish) => fish.hooked = false);
      target = null;
      biteState = null;
      bitePulse = 0;
      hookProximity = 0;
      hookDisplayProximity = 0;
        lastPortraitEmotion = reason.includes("끊어") ? "crying" : reason.includes("느슨") ? "confused" : "disappointed";
        setPhase("missed");
        resetBobber();
      window.GameAudio?.playSfx("miss");
      window.GameAudio?.playVoice("miss");
        setLogs([reason, "[보상] 없음", "[도감] 기록하지 못했다.", "[영우] 물만 쳐다봤다. 물도 부담스러워한다."]);
    }

    function completeCatch() {
      const item = target.item;
      const result = item.kind === "event" ? item : {
        ...item,
        fieldName: field.name,
        gearName: gear().name,
        fame: item.kind === "fish" ? item.level * 50 + item.resistance * 5 + (item.level >= 10 ? 250 : 0) : item.fame || 0
      };
      const shouldRevealG70Key = result.kind === "fish"
        && result.name === "백상아리"
        && state.flags.g70_stolen
        && !state.flags.g70_key_found;
      state = window.GameState.applyCatchResult(state, result);
      heldResult = null;
      lastPortraitEmotion = resultEmotion(result);
      pendingResultEvent = shouldRevealG70Key
        ? "g70_key_found"
        : result.kind === "event" && result.name === "재모의 오리발"
          ? "jaemo_flipper_found"
          : null;
      refreshState();
      swimmers = swimmers.filter((fish) => fish !== target);
      target = null;
      biteState = null;
      bitePulse = 0;
      hookProximity = 0;
      hookDisplayProximity = 0;
      reelHeld = false;
      setPhase("caught");
      resetBobber();
      if (result.kind === "junk") {
        nextJunkDriftAt = performance.now() + rand(8500, 22000);
      } else if (result.kind === "fish") {
        spawnSwimmers();
      }
      window.GameAudio?.playSfx(result.kind === "fish" ? "catchSuccess" : "junk");
      window.GameAudio?.playVoice("success");

      const verb = result.kind === "junk" ? "수집" : result.kind === "event" ? "획득" : "포획";
      const rewardText = rewardTextForResult(result, "없음");
      const recordText = result.kind === "event" ? "[이벤트] 새로운 길이 열렸다." : "[도감] 기록을 갱신했다.";
      setLogs([`[결과] ${result.name} ${verb}!`, `[보상] ${rewardText}`, recordText, `[영우] ${result.desc || "이번엔 진짜 손맛이 있었다."}`]);
      showResultPopup(result);
    }

    function returnGarageIfNeeded() {
      if (g70TheftExitReady) {
        if (g70TheftStage === "appear") return true;
        state.activeField = "fresh";
        state = window.GameState.save(state);
        location.href = "game_home.html";
        return true;
      }
      if (field.gearType !== "sea") return false;
      const pendingG70Theft = firstLeisureBrokenThisTrip
        || (state.flags.first_leisure_broken && state.flags.g70_purchased && !state.flags.g70_stolen);
      if (!pendingG70Theft) return false;
      const event = window.GameState.triggerGarageReturnEvents(window.GameState.load(), { queue: false });
      if (event.triggered === "g70_stolen") {
        state = event.state;
        firstLeisureBrokenThisTrip = true;
        g70TheftExitReady = true;
        g70TheftStage = "appear";
        g70TheftYoungwooLineShown = false;
        setPhase("blocked");
        showEventDialogueStep({
          speaker: "준우",
          portrait: "junwoo",
          lines: ["[나가기] 창고로 돌아가려는 순간.", "[준우] 이 차, 완전 내 스타일이잖아.", "[준우] 잠깐만 쓰고 올게.", "[준우] 도로에서 더 잘 어울리는 사람은 나같은데?"]
        });
        return true;
      }
      return false;
    }

    function update(dt) {
      if (phase === "aimingDistance" || phase === "aimingSide") {
        castGauge += castDir * dt * 0.8;
        if (castGauge >= 1) { castGauge = 1; castDir = -1; }
        if (castGauge <= 0) { castGauge = 0; castDir = 1; }
      }

      if (phase === "casting") {
        if (castFlight) {
          castFlight.t = Math.min(1, castFlight.t + dt / castFlight.duration);
          const t = castFlight.t;
          const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
          bobber.x = castFlight.fromX + (castFlight.toX - castFlight.fromX) * eased;
          bobber.y = castFlight.fromY + (castFlight.toY - castFlight.fromY) * eased - Math.sin(Math.PI * t) * castFlight.arc;
          if (castFlight.t >= 1) {
            castFlight = null;
            if (!castSplashPlayed) {
              castSplashPlayed = true;
              window.GameAudio?.playSfx("splash");
            }
          }
        } else {
          bobber.x += (bobber.targetX - bobber.x) * Math.min(1, dt * 4);
          bobber.y += (bobber.targetY - bobber.y) * Math.min(1, dt * 4);
          biteWait = Math.max(0, biteWait - dt);
          hookTimer -= dt;
        }
        if (!castFlight && biteWait <= 0) pickBiteTarget();
        if (!castFlight && target) updateBiteState(dt);
        hookProximity = castFlight || biteWait > 0 || !target || !biteState ? 0 : biteSuccessRate();
        hookDisplayProximity += (hookProximity - hookDisplayProximity) * Math.min(1, dt * 5.5);
        if (!castFlight && hookTimer <= 0) miss("[실패] 목표가 미끼를 피해 달아났다.");
      }

      bitePulse = Math.max(0, bitePulse - dt * 2.6);

      if (phase === "reeling" && target) {
        fightElapsed += dt;
        const g = gear();
        const titleBonus = window.GameState.titleBonus(state);
        const permanentBonus = window.GameState.permanentBonus ? window.GameState.permanentBonus(state) : {};
        const gearPower = (g.power + (permanentBonus.powerFlat || 0)) * (1 + (titleBonus.power || 0));
        const gearStability = g.stability * (1 + (titleBonus.stability || 0));
        const level10Fight = target.item.kind === "fish" && Number(target.item.level || 0) >= 10;
        const maxTension = 118 + (titleBonus.maxTension || 0) + (permanentBonus.maxTension || 0) + (level10Fight ? 34 : 0);
        const difficulty = Math.max(0.45, (target.item.difficulty || 1) * (level10Fight ? 0.62 : 1));
        const baseFight = fightBehaviorFor(target.item);
        const fight = level10Fight
          ? {
            ...baseFight,
            reelTension: baseFight.reelTension * 0.62,
            pull: baseFight.pull * 1.58,
            escape: baseFight.escape * 0.42,
            surge: baseFight.surge * 0.44,
            vertical: baseFight.vertical * 0.58
          }
          : baseFight;
        const landing = landingPoint();
        const reelActive = reelHeld || (!level10Fight && performance.now() < reelPulseUntil);
        const now = performance.now();
        if (now >= nextFightSurgeAt) {
          fightSurgeUntil = now + rand(240, 680);
          fightSurgeStrength = rand(0.32, 1.08) * clamp(difficulty / 3.2, 0.45, 2.4) * fight.surge;
          nextFightSurgeAt = now + rand(720, 1900) / clamp((difficulty * fight.surge) / 2.6, 0.7, 1.7);
        }
        const surgeActive = now < fightSurgeUntil;
        actionButton.classList.toggle("held", reelActive);
        if (reelActive) {
          tension += dt * (22 + difficulty * 4.4) * (118 / (gearStability * 4 + 92)) * fight.reelTension * (surgeActive ? 1 + fightSurgeStrength * 0.28 : 1);
          const pullDifficulty = Math.min(difficulty, 10);
          const powerRatio = clamp((gearPower * (level10Fight ? 1.36 : 1)) / Math.max(12, target.item.resistance || pullDifficulty * 16), 0.18, 1.55);
          const strainPenalty = powerRatio < 0.72 ? 0.38 + powerRatio * 0.58 : 0.8 + powerRatio * 0.16;
          const surgeDrag = surgeActive ? clamp(1 - fightSurgeStrength * 0.18, 0.62, 1) : 1;
          const pull = dt * Math.max(0.08, gearPower * (0.16 / pullDifficulty) * strainPenalty * surgeDrag * fight.pull);
          const pullCap = clamp(0.006 + powerRatio * (level10Fight ? 0.022 : 0.016), 0.009, level10Fight ? 0.038 : 0.026);
          bobber.x += (landing.x - bobber.x) * Math.min(pullCap, pull);
          bobber.y += (landing.y - bobber.y) * Math.min(pullCap, pull);
          if (fight.type === "bottomHold") bobber.y += dt * (12 + difficulty * 2.2) * fight.vertical;
        } else {
          const releaseTensionCeiling = level10Fight ? tension : null;
          const reliefWave = 0.82 + Math.sin(bobber.t * 2.7 + fightElapsed * 1.4) * 0.18;
          const reliefLuck = Math.random() < dt * 1.8 ? rand(0.62, 1.45) : 1;
          const surgeResistance = level10Fight ? 1 : surgeActive ? clamp(1 - fightSurgeStrength * 0.42, 0.2, 1) : 1;
          const releaseRelief = level10Fight ? 1.42 : 1.18;
          tension -= dt * (12 + difficulty * 2.4) * releaseRelief * reliefWave * reliefLuck * surgeResistance;
          if (surgeActive && !level10Fight) tension += dt * (difficulty * 7.5) * fightSurgeStrength;
          if (!level10Fight) {
            const escapeDx = bobber.x - landing.x;
            const escapeDy = bobber.y - landing.y;
            const escapeDistance = Math.max(1, Math.hypot(escapeDx, escapeDy));
            const escapePull = dt * (18 + difficulty * 7) * fight.escape * (surgeActive ? 1 + fightSurgeStrength * 0.7 : 1);
            bobber.x += (escapeDx / escapeDistance) * escapePull;
            bobber.y += (escapeDy / escapeDistance) * escapePull;
            bobber.x += Math.sin(bobber.t * (fight.type === "dart" ? 3.2 : 1.7)) * dt * (5 + difficulty) * fight.surge;
            bobber.y += Math.cos(bobber.t * 1.3) * dt * (4 + difficulty) * fight.vertical;
            if (fight.type === "runner") bobber.x += Math.sign(escapeDx || 1) * dt * (20 + difficulty * 4);
            if (fight.type === "bottomHold") bobber.y += dt * (18 + difficulty * 3);
          }
          if (releaseTensionCeiling !== null) tension = Math.min(tension, releaseTensionCeiling);
        }
        const tensionWobble = Math.sin(performance.now() / 150) * 0.22;
        tension += tensionWobble;
        if (level10Fight && !reelActive && tensionWobble > 0) tension -= tensionWobble;
        if ((reelActive && tension > maxTension * 0.82) || tension < 20) window.GameAudio?.playSfx("tensionDanger");
        const distance = Math.hypot(bobber.x - landing.x, bobber.y - landing.y);
        const catchFinishDistance = 38;
        const nextCatchProgress = clamp(
          100 * (1 - (distance - catchFinishDistance) / Math.max(1, fightStartDistance - catchFinishDistance)),
          0,
          100
        );
        catchProgress = level10Fight && !reelActive ? Math.max(catchProgress, nextCatchProgress) : nextCatchProgress;
        if (tension < -10) miss("[실패] 줄이 너무 느슨해져 빠져나갔다.");
        if (tension > maxTension) miss("[실패] 줄이 버티지 못하고 끊어졌다.");
        if (phase === "reeling" && fightElapsed > 1.1 && catchProgress <= 0) miss("[실패] 물고기가 멀리 달아났다. 물만 싱글벙글하다.");
        if (phase === "reeling" && (catchProgress >= 96 || distance < catchFinishDistance)) completeCatch();
      }

      if (nextJunkDriftAt > 0 && performance.now() >= nextJunkDriftAt) {
        if (Math.random() < dt * 0.38) {
          nextJunkDriftAt = spawnDelayedJunkSwimmer()
            ? 0
            : performance.now() + rand(7000, 15000);
        }
      }

      const predatorBounds = waterPlayBounds();
      const activePredators = swimmers.filter((fish) => {
        const profile = fish.profile || fishMovementProfile(fish.item);
        return fish.item.kind === "fish"
          && profile.predator
          && !fish.hiddenByPredator
          && swimmerInPlayArea(fish, predatorBounds, 48);
      });

      swimmers.forEach((fish) => {
        const profile = fish.profile || fishMovementProfile(fish.item);
        notifyLevel10Swimmer(fish);
        if (fish.hiddenByPredator) {
          if (!activePredators.length) {
            fish.predatorReturnDelay = Math.max(0, (fish.predatorReturnDelay || 0) - dt);
            if (fish.predatorReturnDelay <= 0) reappearSwimmerAfterPredator(fish, predatorBounds);
          }
          fish.wobble += dt * (profile.wobble || 3);
          return;
        }
        if (!activePredators.length && fish.fleeTarget) {
          fish.fleeTarget = null;
        }
        if (fish.item.kind === "fish" && updatePredatorRoam(fish, profile, predatorBounds, dt)) {
          return;
        }

        if (
          activePredators.length
          && fish.item.kind === "fish"
          && !profile.predator
          && fish !== target
        ) {
          const predator = nearestPredatorFor(fish, activePredators);
          if (!fish.fleeTarget) {
            fish.fleeTarget = predatorSafePointFor(fish, predator, predatorBounds);
            fish.predatorReturnDelay = rand(0.65, 1.45);
          }
          const dx = fish.fleeTarget.x - fish.x;
          const dy = fish.fleeTarget.y - fish.y;
          const distance = Math.max(1, Math.hypot(dx, dy));
          const fleeSpeed = rand(28, 48);
          const separation = swimmerSeparationOffset(fish, swimmers, 112);
          fish.x += (dx / distance) * fleeSpeed * dt;
          fish.y += (dy / distance) * fleeSpeed * dt + Math.sin(bobber.t * 0.42 + fish.wobble) * dt * 2.2;
          fish.x += separation.x * dt * 185;
          fish.y += separation.y * dt * 118;
          if (predator) {
            const pdx = fish.x - predator.x;
            const pdy = fish.y - predator.y;
            const predatorDistance = Math.max(1, Math.hypot(pdx, pdy));
            const keepDistance = 118;
            if (predatorDistance < keepDistance) {
              const push = (keepDistance - predatorDistance) / keepDistance;
              fish.x += (pdx / predatorDistance) * push * dt * 170;
              fish.y += (pdy / predatorDistance) * push * dt * 110;
            }
          }
          fish.vx = Math.abs(fish.vx || swimmerSpeed(fish.item)) * Math.sign(dx || 1);
          fish.x = clamp(fish.x, predatorBounds.minX + 10, predatorBounds.maxX - 10);
          fish.y = clamp(fish.y, predatorBounds.minY, predatorBounds.maxY);
          fish.baseY = fish.y;
          if (distance < 18) {
            fish.hooked = false;
            const holdSeparation = swimmerSeparationOffset(fish, swimmers, 128);
            fish.x = clamp(fish.x + Math.sin(fish.wobble * 1.7) * dt * 12 + holdSeparation.x * dt * 220, predatorBounds.minX + 10, predatorBounds.maxX - 10);
            fish.y = clamp(fish.y + Math.cos(fish.wobble * 1.3) * dt * 8 + holdSeparation.y * dt * 140, predatorBounds.minY, predatorBounds.maxY);
            fish.baseY = fish.y;
            fish.vx = (fish.fleeTarget.driftDir || Math.sign(fish.vx || 1) || 1) * Math.max(4, Math.abs(fish.vx || swimmerSpeed(fish.item)) * 0.28);
            if (performance.now() > (fish.fleeTarget.holdUntil || 0)) {
              fish.fleeTarget = predatorSafePointFor(fish, predator, predatorBounds);
            }
          }
          fish.wobble += dt * Math.max(2.6, profile.wobble || 3);
          return;
        }

        if (fish === target && ((phase === "casting" && !castFlight && biteWait <= 0) || phase === "reeling")) {
          if (phase === "casting" && biteWait > 0) {
            const bounds = waterPlayBounds();
            fish.x += fish.vx * dt;
            fish.y = clamp(fish.y + Math.sin(bobber.t * 0.34 + fish.wobble) * dt * 1.4, bounds.minY, bounds.maxY);
          } else {
            const contact = phase === "casting" ? biteContactStrength() : 1;
            const nudgeX = phase === "casting" ? (target.nibbleOffsetX || 0) * (1 - contact) : 0;
            const nudgeY = phase === "casting" ? (target.nibbleOffsetY || 0) * (1 - contact) : 8;
            const pullRate = phase === "reeling" ? 3.5 : 1.15 + contact * 5.8;
            const idleBackoff = phase === "casting" && contact <= 0.03 ? 22 : 0;
            fish.x += (bobber.x + nudgeX - fish.x) * Math.min(1, dt * pullRate);
            fish.y += (bobber.y + nudgeY - idleBackoff - fish.y) * Math.min(1, dt * pullRate);
            if (phase === "casting" && contact > 0.04) {
              const bitePull = biteState?.pattern?.pulse || 0.6;
              bobber.x += Math.sin(bobber.t * 5.4 + fish.wobble) * dt * 7 * contact;
              bobber.y += dt * (18 + bitePull * 8) * contact;
            }
          }
        } else {
          const bounds = waterPlayBounds();
          if (fish.item.kind === "event" && fish.item.name === "재모의 오리발") {
            fish.x += fish.vx * dt;
            if (fish.x < bounds.minX + 8) {
              fish.x = bounds.minX + 8;
              fish.vx = Math.abs(fish.vx) * rand(0.82, 1.18);
            }
            if (fish.x > bounds.maxX - 12) {
              fish.x = bounds.maxX - 12;
              fish.vx = -Math.abs(fish.vx) * rand(0.82, 1.18);
            }
            const baseY = fish.baseY || fish.y;
            const drift = fish.drift || 18;
            fish.y = clamp(baseY + Math.sin(bobber.t * 0.22 + fish.wobble) * Math.min(drift, 4), bounds.minY + 2, bounds.maxY - 8);
          } else {
            const profile = fish.profile || fishMovementProfile(fish.item);
            const drift = fish.drift || profile.drift || 8;
            if (profile.type === "migratory") {
              fish.x += fish.vx * dt;
              const depthBounds = swimmerDepthBounds(bounds, profile);
              fish.baseY = (fish.baseY || fish.y) + (fish.vy || 0) * dt;
              if (fish.baseY < depthBounds.minY) {
                fish.baseY = depthBounds.minY;
                fish.vy = Math.abs(fish.vy || swimmerVerticalSpeed(fish.item, profile));
              }
              if (fish.baseY > depthBounds.maxY) {
                fish.baseY = depthBounds.maxY;
                fish.vy = -Math.abs(fish.vy || swimmerVerticalSpeed(fish.item, profile));
              }
              fish.y = clamp((fish.baseY || fish.y) + fishVerticalBob(fish, profile), bounds.minY, bounds.maxY);
              if (fish.x < bounds.minX - 210 || fish.x > bounds.maxX + 210) {
                const fromLeft = Math.random() < 0.5;
                fish.x = fromLeft ? bounds.minX - rand(90, 220) : bounds.maxX + rand(90, 220);
                fish.vx = Math.abs(swimmerSpeed(fish.item)) * (fromLeft ? 1 : -1);
                const depth = rand(profile.minDepth, profile.maxDepth);
                fish.baseY = bounds.minY + (bounds.maxY - bounds.minY) * depth;
                fish.y = fish.baseY;
                fish.vy = swimmerVerticalSpeed(fish.item, profile);
              }
            } else if (profile.type === "bottom" || profile.type === "rockfish" || profile.type === "ambush") {
              const crawl = profile.type === "bottom" ? 0.42 : profile.type === "rockfish" ? 0.58 : 0.74;
              fish.x += fish.vx * dt * crawl + Math.sin(bobber.t * 0.35 + fish.wobble) * dt * 2.2;
              if (fish.x < bounds.minX + 8) {
                fish.x = bounds.minX + 8;
                fish.vx = Math.abs(fish.vx) * rand(0.72, 1.04);
              }
              if (fish.x > bounds.maxX - 8) {
                fish.x = bounds.maxX - 8;
                fish.vx = -Math.abs(fish.vx) * rand(0.72, 1.04);
              }
              const bottomFloor = profile.type === "bottom" ? bounds.maxY - 6 : bounds.maxY - 18;
              const depthBounds = swimmerDepthBounds(bounds, profile);
              fish.baseY = (fish.baseY || fish.y) + (fish.vy || 0) * dt;
              if (fish.baseY < depthBounds.minY) {
                fish.baseY = depthBounds.minY;
                fish.vy = Math.abs(fish.vy || swimmerVerticalSpeed(fish.item, profile));
              }
              if (fish.baseY > bottomFloor) {
                fish.baseY = bottomFloor;
                fish.vy = -Math.abs(fish.vy || swimmerVerticalSpeed(fish.item, profile));
              }
              fish.y = clamp(fish.baseY + fishVerticalBob(fish, profile), bounds.minY, bottomFloor);
            } else {
              fish.x += fish.vx * dt;
              if (fish.x < bounds.minX - 90) fish.x = bounds.maxX + 70;
              if (fish.x > bounds.maxX + 90) fish.x = bounds.minX - 70;
              const depthBounds = swimmerDepthBounds(bounds, profile);
              fish.baseY = (fish.baseY || fish.y) + (fish.vy || 0) * dt;
              if (fish.baseY < depthBounds.minY) {
                fish.baseY = depthBounds.minY;
                fish.vy = Math.abs(fish.vy || swimmerVerticalSpeed(fish.item, profile));
              }
              if (fish.baseY > depthBounds.maxY) {
                fish.baseY = depthBounds.maxY;
                fish.vy = -Math.abs(fish.vy || swimmerVerticalSpeed(fish.item, profile));
              }
              fish.y = clamp((fish.baseY || fish.y) + fishVerticalBob(fish, profile), bounds.minY, bounds.maxY);
            }
          }
        }
        if (fish === target && ((phase === "casting" && biteWait <= 0) || phase === "reeling")) {
          const bounds = waterPlayBounds();
          fish.x = clamp(fish.x, bounds.minX - 20, bounds.maxX + 20);
          fish.y = clamp(fish.y, bounds.minY, bounds.maxY);
        }
        fish.wobble += dt * (fish === target && phase === "reeling" ? 12 : (fish.profile?.wobble || 3));
      });

      bobber.t += dt * 4;
    }

    function drawJunwooTheftEvent() {
      const sheet = assetImages.junwooThief;
      if (sheet.complete && sheet.naturalWidth > 0) {
        const frameW = sheet.naturalWidth / 4;
        const frameH = sheet.naturalHeight;
        const frame = 3;
        ctx.save();
        ctx.drawImage(
          sheet,
          frame * frameW,
          0,
          frameW,
          frameH,
          86,
          175,
          112,
          124
        );
        ctx.restore();

    function fishShadowType(item) {
      if (item.kind === "junk" || item.kind === "event") return "Junk";
      if ((item.level || 0) >= 10) return "Giant";
      if (["풍천 뱀장어", "메기", "대형 떡붕어", "멸치", "꽁치"].includes(item.name)) return "Long";
      if (["愿묒뼱"].includes(item.name)) return "Flat";
      if (["블루길", "무지개송어", "서해 거리의 락스타", "망둥어", "근해 참돔"].includes(item.name)) return "Round";
      if ((item.level || 0) >= 8 || ["배스", "가물치", "쏘가리", "부시리", "백상아리"].includes(item.name)) return "Predator";
      if ((item.level || 0) >= 4) return "Round";
      return "Small";
    }

    function fishShadowImage(item) {
      return assetImages[`shadow${fishShadowType(item)}`];

    function swimmerPerspectiveScale(fish) {
      const bounds = waterPlayBounds();
      const depth = clamp((fish.y - bounds.minY) / Math.max(1, bounds.maxY - bounds.minY), 0, 1);
      return 0.55 + depth * 0.65;
    }

    function drawEventSwimmer(fish) {
      if (fish.item.name !== "재모의 오리발") return false;
      const image = assetImages.jaemoFlipper;
      const bob = Math.sin(fish.wobble) * 3;
      const perspective = swimmerPerspectiveScale(fish);
      ctx.save();
      ctx.translate(fish.x, fish.y + bob);
      ctx.globalAlpha = 0.9;
      ctx.shadowColor = "rgba(3, 15, 26, .34)";
      ctx.shadowBlur = 6;
      ctx.fillStyle = "rgba(7, 20, 31, .22)";
      ctx.beginPath();
      ctx.ellipse(0, 10, 34, 9, 0, 0, Math.PI * 2);
      ctx.fill();
      if (image?.complete && image.naturalWidth > 0) {
        const width = 58 * perspective;
        const height = width * (image.naturalHeight / image.naturalWidth);
        ctx.drawImage(image, -width / 2, -height / 2, width, height);
      } else {
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.ellipse(0, 0, 28, 12, -0.18, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      return true;
    }

    function drawSwimmer(fish) {
      if (fish.hiddenByPredator) return;
      const item = fish.item;
      if (item.kind === "event" && drawEventSwimmer(fish)) return;
      ctx.save();
      if (field.id === "sea") clipWaterArea(waterVisualArea());
      const hookedFight = fish === target && phase === "reeling";
      const fightWave = hookedFight ? Math.sin(fish.wobble * 1.45) : 0;
      const fightKick = hookedFight ? Math.cos(fish.wobble * 2.1) : 0;
      ctx.translate(
        fish.x + fightWave * 9,
        fish.y + Math.sin(fish.wobble) * 3 + fightKick * 5
      );
      if (hookedFight) ctx.rotate(fightWave * 0.22);
      if (hookedFight || fish.vx < 0) ctx.scale(-1, 1);
      const visibleCatch = fish === target && (phase === "casting" || phase === "reeling");
      const shadow = item.kind === "fish"
        ? fishSpriteImage(item.name, true)
        : item.kind === "junk"
          ? junkWaterSpriteImage(item.name)
          : fishShadowImage(item);
      const shadowType = fishShadowType(item);
      const levelScale = shadowType === "Giant" ? 4.25 : shadowType === "Predator" ? 3.35 : shadowType === "Flat" ? 3.1 : shadowType === "Long" ? 3.25 : shadowType === "Junk" ? 2.7 : 2.55;
      const perspective = swimmerPerspectiveScale(fish);
      const width = fish.size * perspective * (visibleCatch ? levelScale * 1.08 : levelScale);
      const height = shadow?.complete && shadow.naturalWidth > 0
        ? width * (shadow.naturalHeight / shadow.naturalWidth)
        : width * (shadowType === "Giant" ? 0.42 : shadowType === "Flat" ? 0.48 : shadowType === "Long" ? 0.34 : 0.5);
      ctx.globalAlpha = item.kind === "event" ? 0.58 : visibleCatch ? 0.56 : 0.34;
      ctx.shadowColor = "rgba(3, 15, 26, .36)";
      ctx.shadowBlur = visibleCatch ? 12 : 7;
      if (shadow?.complete && shadow.naturalWidth > 0) {
        ctx.drawImage(shadow, -width / 2, -height / 2, width, height);
      } else {
        ctx.fillStyle = "#061827";
        ctx.beginPath();
        ctx.ellipse(0, 0, width * .36, height * .42, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawHeldResult() {

    function drawPlayer() {
      const base = playerBase();
      const actionSpriteInfo = currentYoungwooSpriteInfo();
      const actionSprite = actionSpriteInfo?.ready ? actionSpriteInfo.image : null;
      const onBoat = field.id === "valley" || field.id === "ocean";

      if (onBoat) {
        const motion = boatMotion();

        drawBoatOverlay(base);
        ctx.restore();

        const midX = (tip.x + bobber.x) / 2;

        ctx.quadraticCurveTo(midX, midY, bobber.x, bobber.y);

    function drawBobber() {
      if (isFirstLeisureBrokenScene()) return;
      const gearId = state.loadout[field.gearType];
      const style = tackleStyles[gearId] || tackleStyles.toyRod;
      const nibbleDrop = bitePulse * (biteState?.committed ? 13 : 7);
      const wave = Math.sin(bobber.t) * 3 + Math.sin(bobber.t * 8.5) * bitePulse * 3 + nibbleDrop;
      const sway = Math.sin(bobber.t * 1.4) * 3 + Math.cos(bobber.t * 7) * bitePulse * 4;
      const anchor = bobberAnchorPoint();
      const anchorX = anchor.x;
      const anchorY = anchor.y + wave;
      const lureX = anchorX + sway;
      const lureY = anchorY + 8;

      ctx.save();
      if ((phase === "reeling" || performance.now() < biteFlashUntil) && target) {
        const pulse = 8 + Math.sin(bobber.t * 5) * 4;
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = phase === "reeling" ? "#fef3c7" : "#bfdbfe";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(lureX, lureY + 8, pulse + 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(lureX, lureY + 8, pulse + 22, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      const tackleImage = assetImages[`tackle_${gearId}`];
      if (tackleImage?.complete && tackleImage.naturalWidth > 0) {
        const drawHeight = style.type === "gem" || style.type === "cube" ? 34 : 30;
        const drawWidth = drawHeight * (tackleImage.naturalWidth / tackleImage.naturalHeight);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(tackleImage, lureX - drawWidth / 2, lureY - drawHeight / 2, drawWidth, drawHeight);
        ctx.restore();
        return;
      }
      ctx.restore();
    }

    function drawCastPreview() {
      if (phase !== "aimingDistance" && phase !== "aimingSide") return;
      const distance = phase === "aimingDistance" ? castGauge : castDistance;
      const side = phase === "aimingDistance" ? 0.5 : castGauge;
      const point = castPreviewPoint(distance, side);
      const tip = rodTip();

      ctx.save();
      ctx.globalAlpha = 0.8;
      ctx.strokeStyle = "#fff7d8";
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 8]);
      ctx.beginPath();
      ctx.moveTo(tip.x, tip.y);
      const midX = (tip.x + point.x) / 2;
      const midY = Math.min(tip.y, point.y) - 105;
      ctx.quadraticCurveTo(midX, midY, point.x, point.y);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.strokeStyle = "#ffd45a";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(point.x, point.y, 22, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(point.x - 31, point.y);
      ctx.lineTo(point.x - 10, point.y);
      ctx.moveTo(point.x + 10, point.y);
      ctx.lineTo(point.x + 31, point.y);
      ctx.moveTo(point.x, point.y - 31);
      ctx.lineTo(point.x, point.y - 10);
      ctx.moveTo(point.x, point.y + 10);
      ctx.lineTo(point.x, point.y + 31);
      ctx.stroke();
      ctx.restore();
    }

    function drawMeterBox() {
      if (!["aimingDistance", "aimingSide", "casting", "reeling"].includes(phase)) return;
      const boxW = 410;
      const boxH = phase === "reeling" ? 142 : 118;
      const boxX = Math.round((W - boxW) / 2);
      const boxY = 84;
      const contentX = boxX + 20;
      const meterW = 330;
      const meterRightX = contentX + meterW;
      const rightTextX = contentX + 220;
      ctx.fillStyle = "rgba(5, 16, 25, .78)";
      ctx.fillRect(boxX, boxY, boxW, boxH);
      ctx.fillStyle = "#e5e7eb";
      ctx.font = "900 18px Malgun Gothic, sans-serif";
      ctx.fillText(phase === "aimingDistance" ? "1단계 거리" : phase === "aimingSide" ? "2단계 좌우" : phase === "casting" ? "챔질 타이밍" : "힘겨루기", contentX, 116);

      if (phase === "aimingDistance" || phase === "aimingSide") {
        ctx.fillStyle = "#1f2937";
        ctx.fillRect(contentX, 140, meterW, 16);
        if (phase === "aimingDistance") {
          ctx.fillStyle = "#22c55e";
          ctx.fillRect(contentX, 140, 112, 16);
          ctx.fillStyle = "#f59e0b";
          ctx.fillRect(contentX + 112, 140, 106, 16);
          ctx.fillStyle = "#ef4444";
          ctx.fillRect(contentX + 218, 140, 112, 16);
        } else {
          const directionGradient = ctx.createLinearGradient(contentX, 0, meterRightX, 0);
          directionGradient.addColorStop(0, "#60a5fa");
          directionGradient.addColorStop(0.5, "#dbeafe");
          directionGradient.addColorStop(1, "#60a5fa");
          ctx.fillStyle = directionGradient;
          ctx.fillRect(contentX, 140, meterW, 16);
          ctx.fillStyle = "rgba(15, 23, 42, .48)";
          ctx.fillRect(contentX + Math.round(meterW / 2) - 2, 136, 4, 24);
        }
        ctx.fillStyle = "#fff7d8";
        ctx.fillRect(contentX + castGauge * (meterW - 6), 134, 8, 28);
        ctx.fillStyle = "#e5e7eb";
        ctx.font = "800 14px Malgun Gothic, sans-serif";
        ctx.fillText(phase === "aimingDistance" ? "가까움" : "좌측", contentX, 182);
        ctx.fillText(phase === "aimingDistance" ? "멀리" : "우측", contentX + 285, 182);
        return;
      }

      if (phase === "casting") {
        ctx.fillStyle = "#1f2937";
        ctx.fillRect(contentX, 140, meterW, 16);
        const shownHookProximity = castFlight ? 0 : hookDisplayProximity;
        ctx.fillStyle = castFlight ? "#64748b" : shownHookProximity > .62 ? "#22c55e" : shownHookProximity > .38 ? "#f59e0b" : "#ef4444";
        ctx.fillRect(contentX, 140, shownHookProximity * meterW, 16);
        ctx.fillStyle = "#e5e7eb";
        ctx.font = "800 14px Malgun Gothic, sans-serif";
        ctx.fillText(castFlight ? "찌 비행 중" : biteWait > 0 ? `입질 대기 ${biteWait.toFixed(1)}초` : `챔질 성공률 ${Math.round(shownHookProximity * 100)}%`, contentX, 182);
        ctx.fillText(castFlight ? "착수 후 대기" : `남은 시간 ${Math.max(0, Math.ceil(hookTimer))}초`, rightTextX, 182);
        const now = performance.now();
        if (fightMessage && now < fightMessageUntil) {
          ctx.fillStyle = "rgba(255, 211, 77, .95)";
          ctx.font = "900 20px Malgun Gothic, sans-serif";
          ctx.fillText(fightMessage, rightTextX + 25, 146);
        }
        return;
      }

      ctx.fillStyle = "#1f2937";
      ctx.fillRect(contentX, 134, meterW, 15);
      const titleBonus = window.GameState.titleBonus(state);
      const permanentBonus = window.GameState.permanentBonus ? window.GameState.permanentBonus(state) : {};
      const level10Fight = target?.item?.kind === "fish" && Number(target.item.level || 0) >= 10;
      const tensionLimit = 118 + (titleBonus.maxTension || 0) + (permanentBonus.maxTension || 0) + (level10Fight ? 34 : 0);
      const reelActive = reelHeld || (!level10Fight && performance.now() < reelPulseUntil);
      const highTensionWarning = reelActive && tension > tensionLimit * 0.76;
      ctx.fillStyle = highTensionWarning || tension < 18 ? "#ef4444" : "#ffd45a";

      ctx.fillStyle = "#e5e7eb";
      ctx.font = "800 14px Malgun Gothic, sans-serif";
      ctx.fillText(`텐션 ${Math.round(tension)} / ${tensionLimit}`, contentX, 165);
      ctx.fillStyle = "#1f2937";
      ctx.fillRect(contentX, 178, meterW, 12);
      ctx.fillStyle = "#2dd4bf";
      ctx.fillRect(contentX, 178, catchProgress * (meterW / 100), 12);
      ctx.fillStyle = "#e5e7eb";
      ctx.font = "800 14px Malgun Gothic, sans-serif";
      ctx.fillText(`포획 ${Math.round(catchProgress)}%`, contentX, 210);
      const taste = !reelActive && tension > tensionLimit * 0.72

      ctx.font = "900 13px Malgun Gothic, sans-serif";
      ctx.fillText(taste, rightTextX + 25, 210);

      fieldHud.textContent = field.name;
      gearHud.textContent = gear().name;
      fameHud.textContent = state.fame.toLocaleString();
      goldHud.textContent = `${state.gold.toLocaleString()}G`;
      g70TheftExitReady = false;
      g70TheftStage = "none";
      g70TheftYoungwooLineShown = false;
      firstLeisureBrokenThisTrip = true;
      lastPortraitEmotion = "panic";
      setPhase("blocked");
      showEventDialogueStep({
        speaker: "낚시왕 남영우",
        portrait: "youngwoo",
        lines: ["[파손] 장비가 첫 던지기에 버티지 못했다.", "[상황] 더는 낚시를 진행할 수 없다.", "[나가기] 지금은 나가기만 가능하다.", "[영우] 일단 돌아가서 상황을 정리하자."]
      });
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      drawBackground();
      swimmers.forEach(drawSwimmer);
      drawWaterOverlay();
      drawCastPreview();
      drawDock();
      drawFreshGroundContact();
      drawPlayer();
      drawBobber();
      updatePortrait();
      drawMeterBox();
      drawFieldAlert();
    }

    function frame(time) {
      const dt = Math.min(0.033, (time - lastTime) / 1000 || 0);
      lastTime = time;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    actionButton.addEventListener("click", () => {
      if (suppressReelClick) {
        suppressReelClick = false;
        return;
      }
      if (phase === "reeling") {
        const level10Fight = target?.item?.kind === "fish" && Number(target.item.level || 0) >= 10;
        reelPulseUntil = level10Fight ? 0 : performance.now() + 320;
        window.GameAudio?.playSfx("reel");
        return;
      }
      if (phase === "caught") {
        setPhase("ready");
        return;
      }
      if (phase === "blocked") {
        return;
      }
      actionPress();
    });

    eventProgressButton.addEventListener("click", advanceG70TheftDialogue);

    homeButton.addEventListener("click", () => {
      state = window.GameState.save(state);
      if (returnGarageIfNeeded()) return;
      location.href = "game_home.html";
    });

    resultClose.addEventListener("click", confirmResultPopup);

    ["contextmenu", "selectstart", "dragstart"].forEach((eventName) => {
      actionButton.addEventListener(eventName, (event) => event.preventDefault(), { capture: true });
    });

    actionButton.addEventListener("touchmove", (event) => event.preventDefault(), { passive: false });

    actionButton.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      if (phase !== "reeling") return;
      reelHeld = true;
      reelPulseUntil = performance.now() + 320;
      suppressReelClick = true;
      window.GameAudio?.playSfx("reel");
      actionButton.classList.add("held");
    });

    ["pointerup", "pointercancel", "pointerleave"].forEach((eventName) => {
      actionButton.addEventListener(eventName, () => {
        reelHeld = false;
        reelPulseUntil = 0;
        actionButton.classList.remove("held");
      });
    });
    window.addEventListener("pointerup", () => {
      reelHeld = false;
      reelPulseUntil = 0;
      actionButton.classList.remove("held");
    });

    window.addEventListener("keydown", (event) => {
      if (event.code !== "Space") return;
      event.preventDefault();
      if (phase === "reeling") {
        reelHeld = true;
        window.GameAudio?.playSfx("reel");
        actionButton.classList.add("held");
      } else {
        actionButton.click();
      }
    });

    window.addEventListener("keyup", (event) => {
      if (event.code !== "Space") return;
      reelHeld = false;
      reelPulseUntil = 0;
      actionButton.classList.remove("held");
    });

    window.addEventListener("resize", () => {
      resizeGame();
      refreshMobileActionLayout();
    });
    window.addEventListener("orientationchange", () => {
      resizeGame();
      setTimeout(refreshMobileActionLayout, 30);
    });
    window.visualViewport?.addEventListener("resize", () => {
      resizeGame();
      refreshMobileActionLayout();
    });
    refreshMobileActionLayout();
    resizeGame();
    refreshState();
    window.GameAudio?.installGlobalUiSounds();
    window.GameAudio?.setScene("fishing", field.id);
    resetBobber();
    spawnSwimmers();
    const debugParams = new URLSearchParams(location.search);
    const devMode = debugParams.get("dev") === "1";
    if (devMode && debugParams.get("debugJunwooTheft") === "1") {
      showDebugJunwooTheftScene();
    } else if (devMode && debugParams.get("debugFirstLeisureBroken") === "1") {
      showDebugFirstLeisureBrokenScene();
    } else if (devMode && debugParams.get("debugTivoliConfiscated") === "1") {
      state.loadout.vehicle = "tivoli";
      state.loadout.sea = "firstLeisure";
      state.activeField = "sea";
      state = window.GameState.save(state);
      refreshState();
      setPhase("blocked");
      showEventDialogueStep({
        eventId: "tivoli_confiscated",
        speaker: "와이프",
        portrait: "wife",
        lines: ["[압수!] 마트 가야 하니까 차 키 줘.", "[와이프] 티볼리는 내가 가져간다.", "[영우] 바다보다 먼저 현실에 걸렸다.", "[안내] 홈으로 돌아가자."]
      });
    } else if (devMode && debugParams.get("debugJaemoFlipper") === "1") {
      state.flags.g70_stolen = true;
      delete state.flags.jaemo_flipper_found;
      state.activeField = "fresh";
      state = window.GameState.save(state);
      refreshState();
      showJaemoFlipperFieldEvent();
    } else if (devMode && debugParams.get("debugG70KeyFound") === "1") {
      state.flags.g70_key_found = true;
      window.GameState.addItem(state, "vehicle", "g70");
      state = window.GameState.save(state);
      refreshState();
      setPhase("blocked");
      showEventDialogueStep({
        eventId: "g70_key_found",
        speaker: "낚시왕 남영우",
        portrait: "youngwoo",
        lines: ["[보조키!] 백상아리 배 속에서 G70 차키를 찾았다.", "[영우] G70 키를 찾았다.", "[영우] 복수의 불길이 다시 살아났다.", "[보상] G70이 창고로 돌아왔다."]
      });
    } else if (devMode && debugParams.get("debugG70KeyDropped") === "1") {
      state.flags.g70_stolen = true;
      state.flags.carnival_owned = true;
      state.flags.first_leisure_broken = true;
      state.flags.first_leisure_exchanged = true;
      state.flags.g70_key_drop_pending = true;
      delete state.flags.g70_key_drop_seen;
      delete state.flags.sea_boat_unlocked;
      state.activeField = "sea";
      state.loadout.vehicle = "carnival";
      state.loadout.sea = "firstLeisure";
      state.loadout.freshwater = "noneFreshwater";
      state.loadout.outfit = "beginnerOutfit";
      window.GameState.addItem(state, "vehicle", "carnival");
      window.GameState.addItem(state, "sea", "firstLeisure");
      state = window.GameState.save(state);
      refreshState();
      showG70KeyDroppedScene();
    } else if (showG70KeyDroppedScene()) {
      // Event scene takes over the action button until the player confirms it.
    } else if (!hasActiveFishingGear()) {
      setPhase("blocked");
      setLogs([
        `[장비] ${gear().name}`,
        field.gearType === "sea" ? "[상점] 바다 장비를 먼저 준비해야 한다." : "[창고] 민물 장비를 먼저 장착해야 한다.",
        "[안내] 낚시를 진행할 수 없다.",
        "[영우] 장비부터 챙기자. 패기는 미끼가 아니다."
      ]);
    } else {
      setPhase("ready");
    }
    requestAnimationFrame(frame);
  
  </script>
  <script src="./mobile_orientation.js"></script>
</body>
</html>
