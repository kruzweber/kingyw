<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>낚시왕 남영우 - 도감</title>
  <style>
    :root {
      --ink: #111522;
      --line: #070a14;
      --gold: #ffd34d;
      --panel: #f5d987;
      --deep: #172035;
      --water: #48accf;
      --green: #68b95f;
      --muted: #8d7a5f;
      --game-scale: 1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101522;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      color: var(--ink);
      image-rendering: pixelated;
      user-select: none;
      overflow: hidden;
    }

    .game-frame {
      position: relative;
      width: calc(1180px * var(--game-scale));
      height: calc(664px * var(--game-scale));
    }

    .screen {
      position: relative;
      width: 1180px;
      height: 664px;
      overflow: hidden;
      border: 8px solid var(--line);
      background:
        linear-gradient(rgba(8, 12, 20, .1), rgba(8, 12, 20, .26)),
        url("./assets/fishdex_modern_study_background.png") center / cover no-repeat;
      box-shadow: 0 0 0 6px #2f3751;
      transform: scale(var(--game-scale));
      transform-origin: top left;
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,.08) 50%, transparent 50%) 0 0 / 8px 8px,
        linear-gradient(rgba(255,255,255,.05) 50%, transparent 50%) 0 0 / 8px 8px;
      pointer-events: none;
      mix-blend-mode: soft-light;
      z-index: 20;
    }

    .screen::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 166px;
      border-top: 6px solid var(--line);
      background: #20263a;
      z-index: 7;
    }

    .card,
    .panel,
    .dialogue,
    .tab,
    .entry,
    .button {
      border: 5px solid var(--line);
      background: var(--panel);
      box-shadow: 6px 6px 0 rgba(0,0,0,.28);
    }

    .progress {
      padding: 10px 14px;
    }

    .progress-title {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      font-size: 17px;
      font-weight: 1000;
    }

    .collection-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .collection-stat {
      border: 3px solid var(--line);
      background: #fff4c8;
      padding: 5px 8px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 14px;
      font-weight: 1000;
    }

    .card { padding: 8px 12px; }

    .title {
      font-size: 32px;
      color: var(--gold);
      font-weight: 1000;
      text-shadow:
        3px 0 0 var(--line),
        -3px 0 0 var(--line),
        0 3px 0 var(--line),
        0 -3px 0 var(--line),
        5px 5px 0 rgba(0,0,0,.28);
    }

    .label {
      display: block;
      color: #665128;
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
    }

    .value {
      display: block;
      margin-top: 6px;
      font-size: 21px;
      font-weight: 1000;
      line-height: 1;
      white-space: nowrap;
    }

    .tabs {
      position: absolute;
      left: 34px;
      top: 34px;
      width: 680px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      z-index: 7;
    }

    .tab {
      height: 52px;
      font: inherit;
      font-size: 15px;
      font-weight: 1000;
      cursor: pointer;
    }

    .tab.active {
      background: var(--gold);
      transform: translateY(-4px);
    }

    .grid-panel {
      position: absolute;
      left: 34px;
      top: 106px;
      width: 680px;
      bottom: 170px;
      padding: 0;
      z-index: 6;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .entry-grid {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      align-content: center;
      gap: 7px;
    }

    .entry-grid.feature-grid {
      grid-template-columns: repeat(3, 1fr);
      align-content: start;
      gap: 14px;
    }

    .entry-grid.ending-grid {
      grid-template-columns: repeat(2, 1fr);
      align-content: start;
      gap: 14px;
    }

    .entry-grid.junk-grid {
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(4, 1fr);
      align-content: stretch;
      gap: 8px;
    }

    .entry {
      height: 54px;
      display: grid;
      grid-template-columns: 1fr;
      align-items: center;
      gap: 5px;
      padding: 5px 7px;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .feature-grid .entry {
      height: 142px;
      padding: 14px 16px;
      align-items: center;
      text-align: left;
    }

    .ending-grid .entry {
      height: 118px;
      padding: 14px 16px;
      grid-template-columns: 60px 1fr;
      align-items: center;
      text-align: left;
      overflow: hidden;
    }

    .entry-trophy {
      width: 54px;
      height: 54px;
      object-fit: contain;
      image-rendering: auto;
      filter: drop-shadow(3px 3px 0 rgba(0,0,0,.25));
    }

    .junk-grid .entry {
      height: 100%;
      min-height: 68px;
      padding: 8px 9px;
      align-items: center;
    }

    .entry.active {
      outline: 5px solid var(--gold);
      outline-offset: -10px;
      box-shadow: 6px 6px 0 rgba(0,0,0,.28), inset 0 0 0 5px rgba(255, 240, 173, .72);
    }

    .entry.locked {
      background: #bda977;
      color: #62513a;
      filter: grayscale(.4);
    }

    .ending-grid .entry.locked {
      filter: none;
    }

    .ending-grid .entry.locked .entry-trophy {
      opacity: 1;
      filter: drop-shadow(3px 3px 0 rgba(0,0,0,.25));
    }

    .entry-name {
      display: block;
      font-size: 13px;
      font-weight: 1000;
      line-height: 1.05;
    }

    .feature-grid .entry-name,
    .ending-grid .entry-name {
      font-size: 22px;
      line-height: 1.1;
      white-space: normal;
    }

    .entry-meta {
      display: block;
      margin-top: 3px;
      color: #665128;
      font-size: 10px;
      font-weight: 900;
    }

    .feature-grid .entry-meta,
    .ending-grid .entry-meta {
      margin-top: 10px;
      font-size: 15px;
    }

    .detail {
      position: absolute;
      right: 24px;
      top: 96px;
      width: 400px;
      bottom: 170px;
      padding: 16px 18px;
      z-index: 6;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .big-icon {
      position: relative;
      width: 150px;
      height: 96px;
      margin: 0 auto 14px;
      box-sizing: border-box;
      border: 6px solid var(--line);
      background: var(--water);
      box-shadow: inset -18px -14px 0 rgba(0,0,0,.22);
    }

    .big-icon::after {
      content: "";
      position: absolute;
      right: -42px;
      top: 24px;
      border-left: 42px solid var(--line);
      border-top: 24px solid transparent;
      border-bottom: 24px solid transparent;
    }

    .big-icon.sprite {
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .big-icon.sprite img {
      max-width: 136px;
      max-height: 82px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(4px 4px 0 rgba(0,0,0,.3));
    }

    .big-icon.specimen-card {
      width: 296px;
      height: 166px;
      background: #75d2df;
      box-shadow:
        5px 6px 0 rgba(0,0,0,.28);
    }

    .big-icon.specimen-card::after {
      display: none;
    }

    .big-icon.specimen-card img {
      max-width: 232px;
      max-height: 96px;
      image-rendering: auto;
      filter: drop-shadow(5px 6px 0 rgba(0,0,0,.22));
    }

    .big-icon.fish-card {
      background: #75d2df;
    }

    .big-icon.junk-card {
      background:
        linear-gradient(90deg, rgba(255,255,255,.08) 50%, transparent 50%) 0 0 / 8px 8px,
        linear-gradient(rgba(255,255,255,.06) 50%, transparent 50%) 0 0 / 8px 8px,
        #5e8f75;
    }

    .big-icon.junk-card img {
      max-width: 204px;
      max-height: 120px;
      filter: drop-shadow(5px 6px 0 rgba(0,0,0,.24));
    }

    .big-icon.event {
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      margin: 0 auto 18px;
      background: #111522;
      box-shadow: 5px 6px 0 rgba(0,0,0,.28);
    }

    .big-icon.event::after {
      display: none;
    }

    .big-icon.event img {
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: contain;
      filter: none;
    }

    .detail.main-screen-detail .detail-title,
    .detail.main-screen-detail .label,
    .detail.main-screen-detail .desc,
    .detail.main-screen-detail .specs {
      display: none;
    }

    .detail.main-screen-detail .detail-view-button {
      margin-top: 0;
    }

    .big-icon.ending {
      width: 190px;
      height: 190px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.08) 50%, transparent 50%) 0 0 / 8px 8px,
        linear-gradient(rgba(255,255,255,.06) 50%, transparent 50%) 0 0 / 8px 8px,
        #77633d;
      box-shadow: 5px 6px 0 rgba(0,0,0,.28);
    }

    .big-icon.ending::after {
      display: none;
    }

    .big-icon.ending img {
      max-width: 104px;
      max-height: 104px;
      object-fit: contain;
      image-rendering: auto;
      filter: drop-shadow(5px 6px 0 rgba(0,0,0,.24));
    }

    .big-icon.locked {
      width: 296px;
      height: 166px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.035) 50%, transparent 50%) 0 0 / 8px 8px,
        linear-gradient(rgba(255,255,255,.025) 50%, transparent 50%) 0 0 / 8px 8px,
        #2f3442;
      box-shadow: 5px 6px 0 rgba(0,0,0,.28);
      filter: none;
      transform: none;
    }

    .big-icon.specimen-card.locked img {
      max-width: 232px;
      max-height: 96px;
      opacity: .72;
      filter: none;
    }

    .big-icon.specimen-card.locked {
      background: #2f3442;
      box-shadow: 5px 6px 0 rgba(0,0,0,.28);
    }

    .big-icon.junk-card.locked img {
      max-width: 204px;
      max-height: 120px;
    }

    .big-icon.locked::after {
      display: none;
    }

    .big-icon.ending.locked {
      width: 190px;
      height: 190px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.08) 50%, transparent 50%) 0 0 / 8px 8px,
        linear-gradient(rgba(255,255,255,.06) 50%, transparent 50%) 0 0 / 8px 8px,
        #77633d;
    }

    .big-icon.ending.locked img {
      max-width: 104px;
      max-height: 104px;
      object-fit: contain;
      opacity: 1;
      filter: drop-shadow(5px 6px 0 rgba(0,0,0,.24));
    }

    .big-icon.event.locked {
      position: relative;
      background:
        linear-gradient(90deg, rgba(255,255,255,.06) 50%, transparent 50%) 0 0 / 8px 8px,
        linear-gradient(rgba(255,255,255,.04) 50%, transparent 50%) 0 0 / 8px 8px,
        #2f3442;
    }

    .big-icon.event.locked img {
      opacity: 1;
      filter: drop-shadow(5px 6px 0 rgba(0,0,0,.24));
    }

    .detail-title {
      display: block;
      margin-bottom: 9px;
      font-size: 26px;
      font-weight: 1000;
      line-height: 1.08;
    }

    .desc {
      min-height: 64px;
      margin: 6px 0 12px;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.35;
    }

    .specs {
      display: grid;
      gap: 8px;
    }

    .spec {
      display: flex;
      justify-content: space-between;
      border: 3px solid var(--line);
      background: #fff4c8;
      padding: 6px 8px;
      font-size: 14px;
      font-weight: 900;
    }

    .spec.hidden {
      display: none;
    }

    .detail-view-button {
      height: 48px;
      margin-top: 12px;
      border: 5px solid var(--line);
      background: #fff0ad;
      color: var(--ink);
      font: inherit;
      font-size: 19px;
      font-weight: 1000;
      cursor: pointer;
      box-shadow: 5px 5px 0 rgba(0,0,0,.26);
    }

    .detail-view-button:hover,
    .detail-view-button:focus-visible {
      background: var(--gold);
      outline: none;
    }

    .detail-view-button[hidden] {
      display: none;
    }

    .preview-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(8, 10, 16, .7);
      z-index: 30;
    }

    .preview-overlay[hidden] {
      display: none;
    }

    .preview-panel {
      width: 820px;
      border: 6px solid var(--line);
      background: var(--panel);
      box-shadow: 10px 10px 0 rgba(0,0,0,.34);
      padding: 16px;
    }

    .preview-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 5px solid var(--line);
      background: #111522 center / contain no-repeat;
      box-shadow: 5px 6px 0 rgba(0,0,0,.24);
    }

    .preview-panel.image-only .preview-title,
    .preview-panel.image-only .preview-desc {
      display: none;
    }

    .preview-panel.image-only {
      display: flex;
      flex-direction: column;
    }

    .preview-panel.image-only .preview-close {
      align-self: flex-end;
      margin-top: 12px;
    }

    .preview-title {
      display: block;
      margin-top: 14px;
      font-size: 30px;
      font-weight: 1000;
      line-height: 1.1;
    }

    .preview-desc {
      margin: 8px 0 14px;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.35;
    }

    .preview-close {
      width: 150px;
      height: 48px;
      border: 5px solid var(--line);
      background: #fff0ad;
      font: inherit;
      font-size: 19px;
      font-weight: 1000;
      cursor: pointer;
      box-shadow: 5px 5px 0 rgba(0,0,0,.26);
    }

    .bottom {
      position: absolute;
      left: 16px;
      right: 464px;
      bottom: 9px;
      height: 148px;
      z-index: 8;
    }

    .dialogue {
      height: 148px;
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 12px;
      padding: 0;
      background: var(--deep);
      overflow: visible;
    }

    .portrait {
      position: relative;
      height: 118px;
      align-self: center;
      margin-left: 8px;
      border: 4px solid var(--line);
      background: #28324a;
      overflow: hidden;
    }

    .portrait img {
      position: absolute;
      inset: 0;
      width: 104px;
      height: 110px;
      image-rendering: auto;
    }

    .dialogue-copy {
      min-width: 0;
      padding: 12px 14px 12px 12px;
      color: #fff3d3;
      font-weight: 900;
      text-shadow: 2px 2px 0 #000;
    }

    .dialogue-speaker {
      display: block;
      margin-bottom: 5px;
      color: var(--gold);
      font-size: 18px;
    }

    .dialogue-line {
      display: block;
      font-size: 15px;
      line-height: 1.42;
      white-space: nowrap;
    }

    .button {
      font: inherit;
      font-size: 22px;
      font-weight: 1000;
      background: #fff0ad;
      cursor: pointer;
    }

    .bottom .button {
      height: auto;
    }

    .dex-actions {
      position: absolute;
      right: 16px;
      bottom: 9px;
      width: 436px;
      height: 148px;
      display: grid;
      z-index: 8;
    }

    .home-button {
      position: absolute !important;
      right: 16px;
      top: 14px;
      z-index: 11;
      min-width: 92px;
      height: 40px;
      border: 4px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 230, 129, .62) 0 7px, transparent 7px),
        var(--panel);
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      font-weight: 1000;
      box-shadow: 4px 4px 0 rgba(0,0,0,.28);
      cursor: pointer;
    }

    .home-button:hover,
    .home-button:focus-visible {
      background:
        linear-gradient(180deg, rgba(255, 235, 144, .78) 0 7px, transparent 7px),
        var(--gold);
      outline: none;
    }

    .dex-actions .progress {
      min-width: 0;
      height: 148px;
      box-sizing: border-box;
      padding: 12px 14px;
      overflow: hidden;
    }

    .dex-actions .progress-title {
      margin-bottom: 10px;
      font-size: 18px;
    }

    .dex-actions .collection-stats {
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .dex-actions .collection-stat {
      align-items: center;
      gap: 6px;
      min-height: 38px;
      font-size: 14px;
      padding: 8px 10px;
    }
  </style>
  <link rel="stylesheet" href="./assets/ui_buttons.css">
  <script src="./mobile_orientation_boot.js"></script>
</head>
<body>
  <div class="game-frame">
  <main class="screen" aria-label="도감 화면">
    <nav class="tabs" aria-label="&#46020;&#44048; &#48516;&#47448;">
      <button class="tab active" type="button" data-tab="freshwater">&#48124;&#47932; 30&#51333;</button>
      <button class="tab" type="button" data-tab="sea">&#48148;&#45796; 30&#51333;</button>
      <button class="tab" type="button" data-tab="junk">&#50976;&#49892;&#47932; 20&#51333;</button>
      <button class="tab" type="button" data-tab="events">메인화면 3종</button>
      <button class="tab" type="button" data-tab="endings">칭호 5종</button>
    </nav>

    <button class="home-button" type="button" onclick="location.href='game_home.html'">&#45208;&#44032;&#44592;</button>

    <section class="grid-panel panel">
      <div class="entry-grid" id="entryGrid"></div>
    </section>

    <aside class="detail panel" aria-label="&#46020;&#44048; &#49345;&#49464;">
      <div class="big-icon" id="detailIcon"></div>
      <strong class="detail-title" id="detailTitle">&#48120;&#54925;&#46301;</strong>
      <span class="label">&#46020;&#44048; &#49444;&#47749;</span>
      <p class="desc" id="detailDesc">&#50500;&#51649; &#54869;&#51064;&#46104;&#51648; &#50506;&#51008; &#54637;&#47785;&#51060;&#45796;.</p>
      <div class="specs">
        <div class="spec"><span>&#48516;&#47448;</span><strong id="detailField">-</strong></div>
        <div class="spec"><span>등급</span><strong id="detailLevel">-</strong></div>
        <div class="spec"><span>HP / &#51200;&#54637;</span><strong id="detailStats">-</strong></div>
        <div class="spec"><span>&#48372;&#49345;</span><strong id="detailReward">-</strong></div>
      </div>
      <button class="detail-view-button" id="detailViewButton" type="button" hidden>보기</button>
    </aside>

    <section class="preview-overlay" id="previewOverlay" hidden>
      <div class="preview-panel" role="dialog" aria-modal="true" aria-label="도감 미리보기">
        <div class="preview-image" id="previewImage"></div>
        <strong class="preview-title" id="previewTitle"></strong>
        <p class="preview-desc" id="previewDesc"></p>
        <button class="preview-close" id="previewClose" type="button">닫기</button>
      </div>
    </section>

    <section class="bottom">
      <aside class="dialogue" aria-label="도감 대사창">
        <div class="portrait">
          <img src="./assets/youngwoo_sprites/portrait_emotions_2x/beginner_neutral.png?v=youngwoo-left-face-outfit-hats-20260604" alt="영우 얼굴">
        </div>
        <div class="dialogue-copy">
          <strong class="dialogue-speaker" id="dexDialogueSpeaker">낚시왕 남영우</strong>
          <span class="dialogue-line" id="dexDialogueLine1">도감은 약속의 영수증이다.</span>
          <span class="dialogue-line" id="dexDialogueLine2">잡은 어종과 유실물을 확인하자.</span>
          <span class="dialogue-line" id="dexDialogueLine3">빈 칸은 아직 영우를 모른 척하고 있다.</span>
        </div>
      </aside>
    </section>

    <section class="dex-actions">
      <div class="progress panel">
        <div class="progress-title">
          <span>&#49688;&#51665;&#54788;&#54889;</span>
          <span id="collectionTotal">0 / 88</span>
        </div>
        <div class="collection-stats">
          <div class="collection-stat"><span>&#50612;&#51333;</span><strong id="fishCollectCount">0/60</strong></div>
          <div class="collection-stat"><span>&#50976;&#49892;&#47932;</span><strong id="junkCollectCount">0/20</strong></div>
          <div class="collection-stat"><span>메인화면</span><strong id="mainCollectCount">1/3</strong></div>
          <div class="collection-stat"><span>칭호</span><strong id="endingCollectCount">0/5</strong></div>
        </div>
      </div>
    </section>
  </main>
  </div>

  <script src="./game_state.js"></script>
  <script src="./audio_manager.js?v=audio-foundation-20260604"></script>
  <script src="./fish_sprite_manifest.js?v=quality-silhouette-live-20260604"></script>
  <script src="./junk_sprite_manifest.js?v=junk-quality-20260604"></script>
  <script>
    function resizeGame() {
      const baseW = 1180;
      const baseH = 664;
      const padding = 0.96;
      const viewport = window.visualViewport;
      const usableWidth = viewport?.width || window.innerWidth;
      const usableHeight = viewport?.height || window.innerHeight;
      const scale = Math.min(usableWidth / baseW, usableHeight / baseH) * padding;

      if (tab === "junk") return gameState.junk.includes(name);
      if (tab === "events") return fallback === "main_start" || Boolean(gameState.flags?.[fallback]);
      if (tab === "endings") {
        return gameState.titles?.owned?.includes(fallback);
      }
      return gameState.caughtFish.includes(name) || fallback;

      detailIcon.closest(".detail")?.classList.toggle("main-screen-detail", tab === "events");

      detailLevel.textContent = hideContent || entry.level === "-" || tab === "events" || tab === "endings" ? "-" : `Lv.${entry.level}`;

      detailReward.textContent = hideContent && tab !== "endings" ? "-" : entry.reward;
      detailField.parentElement.classList.toggle("hidden", tab === "freshwater" || tab === "sea" || tab === "events" || tab === "endings");
      detailLevel.parentElement.classList.toggle("hidden", tab === "junk" || tab === "events" || tab === "endings");

      previewClose.focus();
    }

    function equipDexTitle() {
      if (!activeDetailEntry || activeDetailTab !== "endings" || !activeDetailEntry.owned) return;
      gameState = window.GameState.setEquippedTitle(gameState, activeDetailEntry.unlockId);
      window.GameAudio?.playSfx("title");
      updateDetail(activeDetailEntry, activeDetailTab);
      setDexDialogue([
        `${activeDetailEntry.name} 칭호 장착 완료.`,
        `이제 이름은 ${window.GameState.displayYoungwooName(gameState)}.`,
        activeDetailEntry.reward
      ]);
    }

    function handleDetailButton() {
      if (activeDetailTab === "endings") equipDexTitle();
      else openDetailPreview();
    }

    function closeDetailPreview() {
      previewOverlay.hidden = true;
      previewOverlay.querySelector(".preview-panel")?.classList.remove("image-only");
      previewImage.style.backgroundImage = "";
      detailViewButton.focus();
    }

    function renderTab(tab) {
      gameState = window.GameState.load();
      updateCollectionStatus();
      const goal = window.GameState.currentGoal(gameState);
      const entries = dexData[tab].map((row, index) => normalizeEntry(tab, row, index));
      tabButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === tab);
      });
      entryGrid.classList.toggle("feature-grid", tab === "events");
      entryGrid.classList.toggle("ending-grid", tab === "endings");
      entryGrid.classList.toggle("junk-grid", tab === "junk");

      entryGrid.innerHTML = entries.map((entry, index) => {
        const locked = !entry.owned;
        const name = locked ? "???" : entry.name;
        const meta = tab === "endings"
          ? (gameState.titles?.equipped === entry.unlockId ? "장착중" : entry.owned ? "\uD68D\uB4DD" : "\uBBF8\uD68D\uB4DD")
          : entry.owned ? "\uD68D\uB4DD" : "\uBBF8\uD68D\uB4DD";
        const trophy = tab === "endings" ? `<img class="entry-trophy" src="${titleTrophyImages[entry.unlockId]}" alt="${entry.name} 트로피">` : "";
        return `
          <button class="entry ${locked ? "locked" : ""} ${index === 0 ? "active" : ""}" type="button" data-index="${index}">
            ${trophy}
            <span>
              <span class="entry-name">${name}</span>
              <span class="entry-meta">${meta}</span>
            </span>
          </button>
        `;
      }).join("");

      entryGrid.querySelectorAll("[data-index]").forEach((button) => {
        button.addEventListener("click", () => {
          entryGrid.querySelectorAll(".entry").forEach((entryButton) => entryButton.classList.remove("active"));
          button.classList.add("active");
          updateDetail(entries[Number(button.dataset.index)], tab);
        });
      });

      updateDetail(entries[0], tab);
      setDexDialogue(goal.lines);
    }

    tabButtons.forEach((button) => {
      button.addEventListener("click", () => renderTab(button.dataset.tab));
    });

    detailViewButton.addEventListener("click", handleDetailButton);
    previewClose.addEventListener("click", closeDetailPreview);
    previewOverlay.addEventListener("click", (event) => {
      if (event.target === previewOverlay) closeDetailPreview();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !previewOverlay.hidden) closeDetailPreview();
    });

    window.GameAudio?.installGlobalUiSounds();
    window.GameAudio?.setScene("dex");
    renderTab("freshwater");
  </script>
  <script src="./mobile_orientation.js"></script>
</body>
</html>
