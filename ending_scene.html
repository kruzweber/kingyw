<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>낚시왕 남영우 - 엔딩</title>
  <style>
    :root {
      --line: #070a14;
      --gold: #ffd34d;
      --panel: #f2d18b;
      --ink: #14131a;
      --paper: #fff3d3;
      --game-scale: 1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #080d18;
      color: var(--paper);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      image-rendering: pixelated;
      user-select: none;
    }

    .game-frame {
      position: relative;
      width: calc(1180px * var(--game-scale));
      height: calc(664px * var(--game-scale));
    }

    .screen {
      position: relative;
      width: 1180px;
      height: 664px;
      overflow: hidden;
      border: 8px solid var(--line);
      background: #0f1d32 url("./assets/main_hero_youngwoo_yellowtail_v5.png") center / cover no-repeat;
      box-shadow: 0 0 0 6px #2f3751;
      transform: scale(var(--game-scale));
      transform-origin: top left;
      animation: wake 3.2s ease-out forwards;
      cursor: none;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #000;
      opacity: .8;
      pointer-events: none;
      animation: fade-in-ending 3.8s ease-out forwards;
      z-index: 2;
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,.07) 50%, transparent 50%) 0 0 / 8px 8px,
        linear-gradient(rgba(255,255,255,.045) 50%, transparent 50%) 0 0 / 8px 8px;
      pointer-events: none;
      mix-blend-mode: soft-light;
      z-index: 8;
    }

    .title {
      position: absolute;
      left: 52px;
      top: 42px;
      z-index: 5;
      margin: 0;
      color: var(--gold);
      font-size: 54px;
      font-weight: 1000;
      line-height: 1;
      text-shadow: 5px 5px 0 #000, 0 0 18px rgba(255, 211, 77, .28);
      opacity: 0;
      transform: translateY(14px);
      animation: line-in .8s ease-out 1s forwards;
    }

    .subtitle {
      position: absolute;
      left: 56px;
      top: 108px;
      z-index: 5;
      color: #fff6c8;
      font-size: 23px;
      font-weight: 1000;
      text-shadow: 3px 3px 0 #000;
      opacity: 0;
      transform: translateY(10px);
      animation: line-in .8s ease-out 1.55s forwards;
    }

    .narration {
      position: absolute;
      left: 54px;
      right: 54px;
      bottom: 42px;
      padding: 18px 22px;
      border: 5px solid var(--line);
      background: rgba(12, 18, 32, .88);
      box-shadow: 7px 7px 0 rgba(0,0,0,.34);
      z-index: 5;
    }

    .line {
      display: block;
      min-height: 31px;
      color: var(--paper);
      font-size: 22px;
      font-weight: 1000;
      line-height: 1.42;
      text-shadow: 3px 3px 0 #000;
      opacity: 0;
      transform: translateY(10px);
      animation: line-in .8s ease-out forwards;
    }

    .line:nth-child(1) { animation-delay: 2.2s; }
    .line:nth-child(2) { animation-delay: 3.4s; }
    .line:nth-child(3) { animation-delay: 4.6s; }

    .continue-button {
      position: absolute !important;
      right: 26px;
      top: 22px;
      min-width: 150px;
      height: 52px;
      border: 5px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      font-size: 21px;
      font-weight: 1000;
      text-align: center;
      padding: 0 18px;
      box-shadow: 6px 6px 0 rgba(0,0,0,.28);
      cursor: pointer;
      z-index: 5;
      opacity: 0;
      animation: line-in .6s ease-out 5.8s forwards;
    }

    .continue-button:hover,
    .continue-button:focus-visible {
      background: var(--gold);
      transform: translateX(-10px);
      outline: none;
    }

    @keyframes fade-in-ending {
      0% { opacity: .9; }
      100% { opacity: .16; }
    }

    @keyframes wake {
      0% { filter: brightness(.55) saturate(.75); }
      100% { filter: brightness(1) saturate(1); }
    }

    @keyframes line-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .screen,
      .screen::before,
      .title,
      .subtitle,
      .line,
      .continue-button {
        animation: none;
      }
      .screen::before { opacity: .16; }
      .title,
      .subtitle,
      .line,
      .continue-button {
        opacity: 1;
        transform: none;
      }
    }
  </style>
  <link rel="stylesheet" href="./assets/ui_buttons.css">
  <script src="./mobile_orientation_boot.js"></script>
</head>
<body>
  <div class="game-frame">
    <main class="screen" aria-label="엔딩 장면">
      <h1 class="title" id="endingTitle">엔딩</h1>
      <div class="subtitle" id="endingSubtitle">낚시왕 남영우</div>
      <button class="continue-button" type="button" id="continueButton">창고로 이동</button>
      <section class="narration" aria-label="엔딩 나레이션">
        <span class="line" id="line1"></span>
        <span class="line" id="line2"></span>
        <span class="line" id="line3"></span>
      </section>
    </main>
  </div>

  <script src="./game_state.js"></script>
  <script>
    const endingCopy = {
      revenge_ending_seen: {
        title: "풀세트 복수 엔딩",
        subtitle: "준우야, 장비는 내가 이겼다"
      },
      rich_ending_seen: {
        title: "돈방석 엔딩",
        subtitle: "낚시도 좋지만 돈도 좋다"
      },
      youtuber_ending_seen: {
        title: "골드버튼 엔딩",
        subtitle: "낚시왕 남영우, 떡상하다"
      },
      true_ending_seen: {
        title: "약속 완료 엔딩",
        subtitle: "아빠, 진짜 다 잡아왔네"
      }
    };

    let state = window.GameState.load();
    const params = new URLSearchParams(location.search);
    const requestedEnding = params.get("ending");
    const pendingEnding = window.GameState.peekPendingEnding(state);
    const endingId = requestedEnding && window.GameState.isEndingEvent(requestedEnding) ? requestedEnding : pendingEnding;
    const event = window.GameState.eventDefinitions[endingId];

    function resizeGame() {
      const baseW = 1180;
      const baseH = 664;
      const padding = 0.96;
      const viewport = window.visualViewport;
      const usableWidth = viewport?.width || window.innerWidth;
      const usableHeight = viewport?.height || window.innerHeight;
      const scale = Math.min(usableWidth / baseW, usableHeight / baseH) * padding;
      const desktopLike = window.matchMedia("(pointer: fine) and (min-width: 900px)").matches;
      const maxScale = desktopLike ? 1.25 : 1;
      document.documentElement.style.setProperty("--game-scale", String(Math.min(scale, maxScale)));
    }

    function renderEnding() {
      if (!endingId || !event) {
        location.href = "game_home.html";
        return;
      }
      const copy = endingCopy[endingId] || { title: event.cutin || "엔딩", subtitle: event.speaker || "낚시왕 남영우" };
      const lines = [...(event.lines || []), ...(event.afterLines || [])].slice(0, 3);
      document.getElementById("endingTitle").textContent = copy.title;
      document.getElementById("endingSubtitle").textContent = copy.subtitle;
      document.getElementById("line1").textContent = lines[0] || "";
      document.getElementById("line2").textContent = lines[1] || "";
      document.getElementById("line3").textContent = lines[2] || "";
    }

    function continueGame() {
      state = window.GameState.load();
      if (endingId && state.pendingEvents?.includes(endingId)) {
        state = window.GameState.consumeEvent(state, endingId).state;
      }
      location.href = "game_home.html";
    }

    window.addEventListener("resize", resizeGame);
    window.addEventListener("orientationchange", resizeGame);
    window.visualViewport?.addEventListener("resize", resizeGame);
    document.getElementById("continueButton").addEventListener("click", continueGame);
    window.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") continueGame();
    });
    resizeGame();
    renderEnding();
  </script>
  <script src="./mobile_orientation.js"></script>
</body>
</html>
